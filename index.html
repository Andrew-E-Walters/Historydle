<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historydle - 21st Century Icons</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000; /* Pure black background */
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; }
        .subtitle { color: #a0a0a2; margin-bottom: 25px; font-size: 0.95rem; text-align: center; }

        .game-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-box-row {
            display: flex;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #cccccc; }

        .suggestions {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 999;
        }

        .suggestion-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 1rem;
        }
        .suggestion-item:hover { background-color: #2a2a2b; }

        /* Exactly 7 distinct grid tracks to isolate categories uniformly */
        .grid-header, .guess-row {
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            gap: 6px;
            text-align: center;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .grid-header div { padding: 8px 0; color: #818384; text-transform: uppercase; letter-spacing: 0.5px; }

        .cell {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        /* Strict Spotle Matrix state colors */
        .cell.correct { background-color: var(--green); border-color: var(--green); }
        .cell.partial { background-color: var(--yellow); border-color: var(--yellow); }
        .cell.wrong { background-color: #1a1a1c; border-color: var(--border-color); }

        .cell.name-cell { align-items: flex-start; padding-left: 12px; font-weight: 600; font-size: 0.95rem; }
        .cell span.emoji-icon { font-size: 1.5rem; margin-bottom: 4px; display: block; }
        .cell div.text-label { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; }

        .win-message {
            text-align: center;
            font-size: 1.6rem;
            color: #6aaa64;
            background-color: #121213;
            border: 2px solid var(--green);
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            font-weight: bold;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .share-btn:hover { background-color: #53934f; }
        
        .game-link-anchor { color: #5ab0ff; text-decoration: none; font-weight: bold; }
        .game-link-anchor:hover { text-decoration: underline; }
    </style>
</head>

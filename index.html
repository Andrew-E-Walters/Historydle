<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Persondle - Daily 21st Century Figures</title>

    <style>

        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000;
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
            --red: #8b0000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 4px 0 2px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            font-size: 1.5rem;
            text-align: center;
        }

        .subtitle {
            color: #a0a0a2;
            margin-bottom: 8px;
            font-size: 0.82rem;
            text-align: center;
            line-height: 1.35;
            padding: 0 4px;
        }

        .daily-tracker {
            color: #6aaa64;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guess-counter {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #818384;
            margin-bottom: 8px;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* =========================================================
           SEARCH BAR
           ========================================================= */

        .search-box-row {
            display: flex;
            gap: 8px;
            width: 100%;
            position: sticky;
            top: 8px;
            z-index: 10000;
            background-color: var(--bg-color);
            padding-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            min-width: 0;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus {
            border-color: #818384;
        }

        input:disabled {
            background-color: #1a1a1c;
            color: #555555;
            cursor: not-allowed;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            min-height: 44px;
            flex-shrink: 0;
        }

        .submit-btn:active {
            background-color: #cccccc;
        }

        .submit-btn:disabled {
            background-color: #3a3a3c;
            color: #777777;
            cursor: not-allowed;
        }

        /* =========================================================
           MOBILE-FRIENDLY SCROLLABLE SUGGESTIONS
           ========================================================= */

        .suggestions {
            position: absolute;

            top: calc(100% + 4px);
            left: 0;
            right: 0;

            background-color: var(--card-bg);

            border: 2px solid var(--border-color);
            border-radius: 8px;

            height: 280px;
            max-height: 280px;

            overflow-y: scroll;
            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior: contain;

            touch-action: pan-y;

            z-index: 99999;

            display: none;

            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);

            scrollbar-width: thin;
        }

        .suggestions::-webkit-scrollbar {
            width: 8px;
        }

        .suggestions::-webkit-scrollbar-track {
            background: #121213;
        }

        .suggestions::-webkit-scrollbar-thumb {
            background: #555555;
            border-radius: 10px;
        }

        .suggestions::-webkit-scrollbar-thumb:hover {
            background: #777777;
        }

        .suggestion-item {
            padding: 14px;
            min-height: 48px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 0.95rem;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: #2a2a2b;
        }

        .suggestion-item:active {
            background-color: #3a3a3c;
        }

        /* =========================================================
           GUESS CARDS
           ========================================================= */

        .guess-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .guess-card-header {
            font-size: 1.05rem;
            font-weight: bold;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .cell {
            background-color: #1a1a1c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-align: center;
        }

        .cell.correct {
            background-color: var(--green);
            border-color: var(--green);
        }

        .cell.partial {
            background-color: var(--yellow);
            border-color: var(--yellow);
            color: #000000;
        }

        .cell.partial .text-label,
        .cell.partial .attr-title {
            color: #000000;
        }

        .cell.wrong {
            background-color: #1a1a1c;
            border-color: var(--border-color);
        }

        .cell .attr-title {
            font-size: 0.62rem;
            text-transform: uppercase;
            color: #818384;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .cell .emoji-icon {
            font-size: 1.05rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .cell .text-label {
            font-size: 0.68rem;
            font-weight: 600;
            width: 100%;
            line-height: 1.2;
        }

        /* =========================================================
           END GAME
           ========================================================= */

        .end-game-message {
            text-align: center;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            border: 2px solid var(--green);
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            line-height: 1.4;
        }

        .end-game-message.loss {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .end-game-message.win {
            border-color: var(--green);
            color: #ffffff;
        }

        /* =========================================================
           PERSON OF THE DAY PHOTO
           ========================================================= */

        .secret-photo-container {
            margin-top: 14px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .secret-photo {
            display: block;
            width: 100%;
            max-width: 320px;
            max-height: 380px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background-color: #1a1a1c;
        }

        .secret-photo-caption {
            margin-top: 6px;
            color: #818384;
            font-size: 0.72rem;
            font-weight: normal;
        }

        .secret-person-name {
            margin-top: 10px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .next-person-timer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #a0a0a2;
            font-weight: normal;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            text-transform: uppercase;
            width: 100%;
        }

        .share-btn:active {
            opacity: 0.9;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .game-container {
                max-width: 100%;
            }

            .suggestions {
                height: 300px;
                max-height: 300px;
            }

            .suggestion-item {
                min-height: 50px;
                padding: 15px;
                font-size: 1rem;
            }

            .attributes-grid {
                gap: 5px;
            }

            .cell {
                min-height: 54px;
            }

            .secret-photo {
                max-width: 100%;
                max-height: 400px;
            }
        }

    </style>
</head>

        function parseNumericValue(val) {

            if (typeof val === 'number') {
                return val;
            }

            if (!val) {
                return 0;
            }

            const str = String(val)
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '');

            let multiplier = 1;

            if (
                str.endsWith('B') ||
                str.endsWith('BN') ||
                str.endsWith('BILLION')
            ) {

                multiplier = 1e9;

            } else if (
                str.endsWith('M') ||
                str.endsWith('MN') ||
                str.endsWith('MILLION')
            ) {

                multiplier = 1e6;

            } else if (
                str.endsWith('K') ||
                str.endsWith('THOUSAND')
            ) {

                multiplier = 1e3;

            }

            const num = parseFloat(
                str.replace(/[^0-9.-]+/g, "")
            );

            return isNaN(num) ? 0 : num * multiplier;

        }

        /* =========================================================

        function updateCountdown() {

            const now =
                new Date();

            const tomorrow =
                new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate() + 1
                );

            const diffMs =
                tomorrow - now;


            const hours =
                String(
                    Math.floor(
                        (
                            diffMs /
                            (1000 * 60 * 60)
                        ) % 24
                    )
                ).padStart(2, '0');


            const minutes =
                String(
                    Math.floor(
                        (
                            diffMs /
                            (1000 * 60)
                        ) % 60
                    )
                ).padStart(2, '0');


            const seconds =
                String(
                    Math.floor(
                        diffMs /
                        1000
                    ) % 60
                ).padStart(2, '0');


            document.getElementById(
                'countdown'
            ).textContent =
                `${hours}:${minutes}:${seconds}`;

        }


        setInterval(
            updateCountdown,
            1000
        );

        updateCountdown();

        function countGreenAttributes(
            guess,
            target
        ) {

            let greenCount = 0;

            if (
                guess.arena === target.arena
            ) greenCount++;

            if (
                guess.netWorth === target.netWorth
            ) greenCount++;

            if (
                guess.country === target.country
            ) greenCount++;

            if (
                guess.followers === target.followers
            ) greenCount++;

            if (
                guess.gender === target.gender
            ) greenCount++;

            if (
                guess.age === target.age
            ) greenCount++;

            return greenCount;

        }

        /* =========================================================
           GAME OVER
           ========================================================= */

        function triggerGameOver(
            won,
            attempts
        ) {

            gameOver = true;

            endGameText.textContent =
                getEndGameMessage(
                    attempts,
                    won
                );

            endGameBox.className =
                `end-game-message ${
                    won ? 'win' : 'loss'
                }`;

            endGameBox.style.display =
                'block';

            input.disabled = true;

            submitBtn.disabled = true;

            suggestionsBox.style.display =
                'none';


            if (
                !won &&
                !document
                    .querySelector(
                        '.guess-card-header span'
                    )
                    ?.textContent
                    .includes(
                        'SECRET FIGURE'
                    )
            ) {

                renderGuessCard(
                    secretFigure,
                    true
                );

            }

        }


        /* =========================================================
           SUBMIT GUESS
           ========================================================= */

        function submitGuess() {

            if (gameOver) {
                return;
            }


            const guessName =
                input.value.trim();


            const figure =
                figures.find(
                    f =>
                        f.name
                            .toLowerCase() ===
                        guessName.toLowerCase()
                );


            if (!figure) {

                alert(
                    "Please select a valid figure from the dropdown list."
                );

                return;

            }


            if (
                guessedNames.has(
                    figure.name
                )
            ) {

                alert(
                    "You've already guessed this figure!"
                );

                return;

            }


            guessedNames.add(
                figure.name
            );

            guessHistoryObjects.push(
                figure
            );


            saveState();


            input.value = '';

            suggestionsBox.style.display =
                'none';


            const currentAttemptCount =
                guessedNames.size;


            guessCounterDisplay.textContent =
                `Guesses: ${currentAttemptCount} / ${maxGuesses}`;


            renderGuessCard(
                figure
            );


            if (
                figure.name ===
                secretFigure.name
            ) {

                triggerGameOver(
                    true,
                    currentAttemptCount
                );

                endGameBox.scrollIntoView({
                    behavior: 'smooth'
                });

            } else if (
                currentAttemptCount >=
                maxGuesses
            ) {

                triggerGameOver(
                    false,
                    currentAttemptCount
                );

                endGameBox.scrollIntoView({
                    behavior: 'smooth'
                });

            }

        }

    // If the user types multiple words, match the beginning
    // of the corresponding first/last name parts.
    const queryParts = cleanQuery.split(/\s+/);

    if (queryParts.length > 1) {
        return queryParts.every((queryPart, index) => {
            return nameParts[index] &&
                   nameParts[index].startsWith(queryPart);
        });
    }

    // Single letter/word:
    // Match the START of either the first name OR last name.
    return nameParts.some(part => part.startsWith(cleanQuery));
}


function showSuggestions() {

    if (gameOver) {
        suggestionsBox.style.display = 'none';
        return;
    }

    const query = input.value.trim().toLowerCase();

    suggestionsBox.innerHTML = '';

    const matches = figures.filter(function (figure) {

        return !guessedNames.has(figure.name) &&
               nameMatchesSearch(figure.name, query);

    });

    if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }

    matches.forEach(function (figure) {

        const suggestionItem = document.createElement('div');

        suggestionItem.className = 'suggestion-item';

        // Only display the person's name.
        suggestionItem.textContent = figure.name;

        /*
         * IMPORTANT:
         *
         * Do NOT use mousedown here.
         *
         * On mobile, mousedown fires immediately when the
         * user's finger touches the screen. That prevents
         * normal scrolling.
         *
         * Using click allows the browser to distinguish
         * between a tap and a swipe/scroll.
         */

        suggestionItem.addEventListener('click', function (event) {

            event.stopPropagation();

            input.value = figure.name;

            suggestionsBox.style.display = 'none';

            input.focus();

        });

        suggestionsBox.appendChild(suggestionItem);
    });

    suggestionsBox.style.display = 'block';
}


// Typing in the search box
input.addEventListener('input', function () {

    if (gameOver) {
        suggestionsBox.style.display = 'none';
        return;
    }

    showSuggestions();

});


// Tapping/focusing the search box opens the full list.
//
// This is what allows the player to simply tap the box
// and scroll through all available people without typing.
input.addEventListener('focus', function () {

    if (gameOver) return;

    showSuggestions();

});


// Clicking the input again should keep the list available.
input.addEventListener('click', function () {

    if (gameOver) return;

    showSuggestions();

});


// Close the dropdown when clicking outside the search area.
document.addEventListener('click', function (e) {

    if (!e.target.closest('.input-wrapper')) {
        suggestionsBox.style.display = 'none';
    }

});


// Submit button
submitBtn.addEventListener('click', submitGuess);


// Enter key
input.addEventListener('keydown', function (e) {

    if (e.key === 'Enter') {

        e.preventDefault();

        submitGuess();

    }

});

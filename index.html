<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Persondle - Daily 21st Century Figures</title>

    <style>

        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000;
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
            --red: #8b0000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 4px 0 2px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            font-size: 1.5rem;
            text-align: center;
        }

        .subtitle {
            color: #a0a0a2;
            margin-bottom: 8px;
            font-size: 0.82rem;
            text-align: center;
            line-height: 1.35;
            padding: 0 4px;
        }

        .daily-tracker {
            color: #6aaa64;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guess-counter {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #818384;
            margin-bottom: 8px;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* =========================================================
           SEARCH BAR
           ========================================================= */

        .search-box-row {
            display: flex;
            gap: 8px;
            width: 100%;
            position: sticky;
            top: 8px;
            z-index: 10000;
            background-color: var(--bg-color);
            padding-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            min-width: 0;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus {
            border-color: #818384;
        }

        input:disabled {
            background-color: #1a1a1c;
            color: #555555;
            cursor: not-allowed;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            min-height: 44px;
            flex-shrink: 0;
        }

        .submit-btn:active {
            background-color: #cccccc;
        }

        .submit-btn:disabled {
            background-color: #3a3a3c;
            color: #777777;
            cursor: not-allowed;
        }

        /* =========================================================
           MOBILE-FRIENDLY SCROLLABLE SUGGESTIONS
           ========================================================= */

        .suggestions {
            position: absolute;

            top: calc(100% + 4px);
            left: 0;
            right: 0;

            background-color: var(--card-bg);

            border: 2px solid var(--border-color);
            border-radius: 8px;

            height: 280px;
            max-height: 280px;

            overflow-y: scroll;
            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior: contain;

            touch-action: pan-y;

            z-index: 99999;

            display: none;

            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);

            scrollbar-width: thin;
        }

        .suggestions::-webkit-scrollbar {
            width: 8px;
        }

        .suggestions::-webkit-scrollbar-track {
            background: #121213;
        }

        .suggestions::-webkit-scrollbar-thumb {
            background: #555555;
            border-radius: 10px;
        }

        .suggestions::-webkit-scrollbar-thumb:hover {
            background: #777777;
        }

        .suggestion-item {
            padding: 14px;
            min-height: 48px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 0.95rem;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: #2a2a2b;
        }

        .suggestion-item:active {
            background-color: #3a3a3c;
        }

        /* =========================================================
           GUESS CARDS
           ========================================================= */

        .guess-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .guess-card-header {
            font-size: 1.05rem;
            font-weight: bold;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .cell {
            background-color: #1a1a1c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-align: center;
        }

        .cell.correct {
            background-color: var(--green);
            border-color: var(--green);
        }

        .cell.partial {
            background-color: var(--yellow);
            border-color: var(--yellow);
            color: #000000;
        }

        .cell.partial .text-label,
        .cell.partial .attr-title {
            color: #000000;
        }

        .cell.wrong {
            background-color: #1a1a1c;
            border-color: var(--border-color);
        }

        .cell .attr-title {
            font-size: 0.62rem;
            text-transform: uppercase;
            color: #818384;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .cell .emoji-icon {
            font-size: 1.05rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .cell .text-label {
            font-size: 0.68rem;
            font-weight: 600;
            width: 100%;
            line-height: 1.2;
        }

        /* =========================================================
           END GAME
           ========================================================= */

        .end-game-message {
            text-align: center;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            border: 2px solid var(--green);
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            line-height: 1.4;
        }

        .end-game-message.loss {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .end-game-message.win {
            border-color: var(--green);
            color: #ffffff;
        }

        /* =========================================================
           PERSON OF THE DAY PHOTO
           ========================================================= */

        .secret-photo-container {
            margin-top: 14px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .secret-photo {
            display: block;
            width: 330px;
            max-width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background-color: #1a1a1c;
        }

        .secret-photo-fallback {
            margin-top: 6px;
            color: #ff4d4d;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .secret-photo-container.photo-load-failed .secret-photo {
            display: none;
        }

        .secret-photo-container.photo-validating .secret-photo {
            opacity: 0.7;
        }

        .secret-photo-caption {
            margin-top: 6px;
            color: #818384;
            font-size: 0.72rem;
            font-weight: normal;
        }

        .secret-person-name {
            margin-top: 10px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .next-person-timer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #a0a0a2;
            font-weight: normal;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            text-transform: uppercase;
            width: 100%;
        }

        .share-btn:active {
            opacity: 0.9;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .game-container {
                max-width: 100%;
            }

            .suggestions {
                height: 300px;
                max-height: 300px;
            }

            .suggestion-item {
                min-height: 50px;
                padding: 15px;
                font-size: 1rem;
            }

            .attributes-grid {
                gap: 5px;
            }

            .cell {
                min-height: 54px;
            }

            .secret-photo {
                max-width: 100%;
                max-height: 400px;
            }
        }

    </style>
</head>

        function parseNumericValue(val) {

            if (typeof val === 'number') {
                return val;
            }

            if (!val) {
                return 0;
            }

            const str = String(val)
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '');

            let multiplier = 1;

            if (
                str.endsWith('B') ||
                str.endsWith('BN') ||
                str.endsWith('BILLION')
            ) {

                multiplier = 1e9;

            } else if (
                str.endsWith('M') ||
                str.endsWith('MN') ||
                str.endsWith('MILLION')
            ) {

                multiplier = 1e6;

            } else if (
                str.endsWith('K') ||
                str.endsWith('THOUSAND')
            ) {

                multiplier = 1e3;

            }

            const num = parseFloat(
                str.replace(/[^0-9.-]+/g, "")
            );

            return isNaN(num) ? 0 : num * multiplier;

        }

        /* =========================================================
           PERSON OF THE DAY PHOTO
           ========================================================= */

        function getPersonPhotoUrl(figure) {
            if (!figure || !figure.photoUrl) return '';

            // v7 prefers a URL that was already validated during the
            // background database pre-check. This means the end-game reveal
            // does not have to discover a broken Wikimedia filename first.
            if (resolvedPersonPhotoCache.has(figure.name)) {
                return resolvedPersonPhotoCache.get(figure.name);
            }

            const photoUrl = String(figure.photoUrl).trim();

            // Convert Wikimedia "Redirect/file" URLs into the more reliable
            // Special:FilePath endpoint and properly encode the filename.
            const redirectMarker = '/Special:Redirect/file/';
            const redirectIndex = photoUrl.indexOf(redirectMarker);
            if (redirectIndex !== -1) {
                const fileName = photoUrl.slice(redirectIndex + redirectMarker.length);
                if (fileName) {
                    return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(decodeURIComponent(fileName))}?width=600`;
                }
            }

            if (photoUrl.includes('#/media/File:')) {
                const fileName = photoUrl.split('#/media/File:')[1];
                if (fileName) {
                    return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(decodeURIComponent(fileName))}?width=600`;
                }
            }

            return photoUrl;
        }

        function getPersonPhotoFallbackUrl(figure) {
            if (!figure || !figure.photoUrl) return '';
            const photoUrl = String(figure.photoUrl).trim();
            const redirectMarker = '/Special:Redirect/file/';
            const redirectIndex = photoUrl.indexOf(redirectMarker);

            if (redirectIndex !== -1) {
                const fileName = photoUrl.slice(redirectIndex + redirectMarker.length);
                if (fileName) {
                    return `https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(decodeURIComponent(fileName))}`;
                }
            }

            return '';
        }

        // Photo validation/repair cache. A broken Wikimedia filename is repaired
        // automatically the first time that person is revealed. Successful
        // resolutions are cached for the rest of the session.
        const resolvedPersonPhotoCache = new Map();
        const failedPersonPhotoCache = new Set();

        function getCommonsFileName(figure) {
            if (!figure || !figure.photoUrl) return '';
            const photoUrl = String(figure.photoUrl).trim();
            const redirectMarker = '/Special:Redirect/file/';
            const redirectIndex = photoUrl.indexOf(redirectMarker);

            if (redirectIndex !== -1) {
                return decodeURIComponent(photoUrl.slice(redirectIndex + redirectMarker.length));
            }

            if (photoUrl.includes('#/media/File:')) {
                return decodeURIComponent(photoUrl.split('#/media/File:')[1]);
            }

            return '';
        }

        function normalizePhotoSearchText(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[_-]+/g, ' ')
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function lookupCommonsExactPhoto(fileName) {
            if (!fileName) return '';

            const apiUrl =
                'https://commons.wikimedia.org/w/api.php' +
                '?action=query' +
                '&format=json' +
                '&origin=*' +
                '&prop=imageinfo' +
                '&iiprop=url|mime' +
                '&iiurlwidth=600' +
                `&titles=${encodeURIComponent('File:' + fileName)}`;

            try {
                const response = await fetch(apiUrl, { cache: 'no-store' });
                if (!response.ok) return '';
                const data = await response.json();
                const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
                const page = pages.find(item => item && item.imageinfo && item.imageinfo[0]);
                const imageInfo = page && page.imageinfo && page.imageinfo[0];
                if (!imageInfo) return '';
                if (imageInfo.mime && !String(imageInfo.mime).toLowerCase().startsWith('image/')) return '';
                const candidateUrl = imageInfo.thumburl || imageInfo.url || '';
                if (!candidateUrl) return '';
                return await probeImageUrl(candidateUrl, 7000) ? candidateUrl : '';
            } catch (error) {
                return '';
            }
        }

        async function searchCommonsPersonPhoto(figure) {
            if (!figure || !figure.name) return '';

            const apiUrl =
                'https://commons.wikimedia.org/w/api.php' +
                '?action=query' +
                '&format=json' +
                '&origin=*' +
                '&generator=search' +
                '&gsrnamespace=6' +
                '&gsrlimit=10' +
                `&gsrsearch=${encodeURIComponent('"' + figure.name + '"')}` +
                '&prop=imageinfo' +
                '&iiprop=url|mime' +
                '&iiurlwidth=600';

            try {
                const response = await fetch(apiUrl, { cache: 'no-store' });
                if (!response.ok) return '';
                const data = await response.json();
                const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
                const nameTokens = normalizePhotoSearchText(figure.name)
                    .split(' ')
                    .filter(token => token.length > 2);

                const candidates = pages
                    .map(page => {
                        const imageInfo = page && page.imageinfo && page.imageinfo[0];
                        if (!imageInfo || (imageInfo.mime && !String(imageInfo.mime).toLowerCase().startsWith('image/'))) return null;
                        const title = normalizePhotoSearchText(page.title || '');
                        const tokenMatches = nameTokens.filter(token => title.includes(token)).length;
                        const exactNameMatch = normalizePhotoSearchText(page.title || '').includes(normalizePhotoSearchText(figure.name));
                        return {
                            url: imageInfo.thumburl || imageInfo.url || '',
                            score: tokenMatches + (exactNameMatch ? 10 : 0),
                            title
                        };
                    })
                    .filter(Boolean)
                    .filter(candidate => candidate.url && candidate.score >= Math.max(1, nameTokens.length));

                candidates.sort((a, b) => b.score - a.score);

                // Do not assume that a Commons search result is actually
                // loadable. Probe candidates in score order and keep the first
                // image that the browser can successfully fetch.
                for (const candidate of candidates) {
                    if (await probeImageUrl(candidate.url, 7000)) {
                        return candidate.url;
                    }
                }

                return '';
            } catch (error) {
                return '';
            }
        }

        async function repairPersonPhoto(figure) {
            if (!figure || !figure.name) return '';
            if (resolvedPersonPhotoCache.has(figure.name)) return resolvedPersonPhotoCache.get(figure.name);
            if (failedPersonPhotoCache.has(figure.name)) return '';

            const fileName = getCommonsFileName(figure);
            let repairedUrl = await lookupCommonsExactPhoto(fileName);

            // If the stored filename no longer exists, search Commons for a
            // likely image whose title matches the Persondle figure's name.
            if (!repairedUrl) {
                repairedUrl = await searchCommonsPersonPhoto(figure);
            }

            // A second, broader search helps names that Commons indexes under
            // a stage name, nickname, punctuation variant, or maiden name.
            if (!repairedUrl && figure.name) {
                const broadQuery = normalizePhotoSearchText(figure.name)
                    .split(' ')
                    .filter(token => token.length > 2)
                    .slice(0, 4)
                    .join(' ');

                if (broadQuery) {
                    repairedUrl = await searchCommonsPersonPhoto({
                        ...figure,
                        name: broadQuery
                    });
                }
            }

            if (repairedUrl) {
                resolvedPersonPhotoCache.set(figure.name, repairedUrl);
                return repairedUrl;
            }

            failedPersonPhotoCache.add(figure.name);
            return '';
        }

        /*
         * v7 DATABASE PHOTO PRE-CHECK
         *
         * The full Persondle database is checked in the background as soon as
         * the game loads. Wikimedia filenames are checked in batches through
         * the Commons API, rather than loading 397 images into the page.
         * Any filename that no longer exists is then repaired by searching
         * Commons for a likely image matching the figure's name.
         *
         * This runs independently of gameplay, so it never delays the first
         * screen or blocks the player from starting a round.
         */
        let allPersonPhotosPrevalidated = false;
        let allPersonPhotosPrevalidationPromise = null;

        function chunkArray(items, size) {
            const chunks = [];
            for (let i = 0; i < items.length; i += size) {
                chunks.push(items.slice(i, i + size));
            }
            return chunks;
        }

        async function validateCommonsPhotoBatch(figuresBatch) {
            const entries = figuresBatch
                .map(figure => ({
                    figure,
                    fileName: getCommonsFileName(figure)
                }))
                .filter(entry => entry.fileName);

            if (!entries.length) return [];

            const titles = entries.map(entry => `File:${entry.fileName}`).join('|');
            const apiUrl =
                'https://commons.wikimedia.org/w/api.php' +
                '?action=query' +
                '&format=json' +
                '&origin=*' +
                '&prop=imageinfo' +
                '&iiprop=url|mime' +
                '&iiurlwidth=600' +
                `&titles=${encodeURIComponent(titles)}`;

            try {
                const response = await fetch(apiUrl, { cache: 'no-store' });
                if (!response.ok) return entries.map(entry => ({ ...entry, url: '' }));

                const data = await response.json();
                const pages = data && data.query && data.query.pages
                    ? Object.values(data.query.pages)
                    : [];

                const pageByTitle = new Map(
                    pages
                        .filter(page => page && page.imageinfo && page.imageinfo[0])
                        .map(page => [normalizePhotoSearchText(page.title || ''), page])
                );

                return entries.map(entry => {
                    const normalizedTitle = normalizePhotoSearchText(`File:${entry.fileName}`);
                    const page = pageByTitle.get(normalizedTitle);
                    const imageInfo = page && page.imageinfo && page.imageinfo[0];

                    if (
                        !imageInfo ||
                        (imageInfo.mime && !String(imageInfo.mime).toLowerCase().startsWith('image/'))
                    ) {
                        return { ...entry, url: '' };
                    }

                    return {
                        ...entry,
                        url: imageInfo.thumburl || imageInfo.url || ''
                    };
                });
            } catch (error) {
                return entries.map(entry => ({ ...entry, url: '' }));
            }
        }

        function probeImageUrl(url, timeoutMs = 9000) {
            if (!url) return Promise.resolve(false);

            return new Promise(resolve => {
                const image = new Image();
                let settled = false;

                const finish = result => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timeoutId);
                    image.onload = null;
                    image.onerror = null;
                    resolve(result);
                };

                const timeoutId = setTimeout(() => finish(false), timeoutMs);

                image.onload = () => finish(true);
                image.onerror = () => finish(false);
                image.src = url;
            });
        }

        async function prevalidateAllPersonPhotos() {
            if (allPersonPhotosPrevalidated) return;
            if (allPersonPhotosPrevalidationPromise) {
                return allPersonPhotosPrevalidationPromise;
            }

            allPersonPhotosPrevalidationPromise = (async () => {
                const commonsFigures = figures.filter(figure => getCommonsFileName(figure));
                const directUrlFigures = figures.filter(figure => !getCommonsFileName(figure));

                let validatedCount = 0;
                let repairedCount = 0;
                let failedCount = 0;

                // 50 Commons titles per API request keeps the startup work small
                // while still checking the entire database.
                const batches = chunkArray(commonsFigures, 50);

                for (const batch of batches) {
                    const results = await validateCommonsPhotoBatch(batch);

                    const missing = [];

                    results.forEach(result => {
                        if (result.url) {
                            resolvedPersonPhotoCache.set(result.figure.name, result.url);
                            validatedCount++;
                        } else {
                            missing.push(result.figure);
                        }
                    });

                    // Repair only the filenames that failed the exact lookup.
                    // This avoids unnecessary Commons searches for healthy photos.
                    if (missing.length) {
                        const repairResults = await Promise.all(
                            missing.map(figure => repairPersonPhoto(figure))
                        );

                        repairResults.forEach(url => {
                            if (url) {
                                repairedCount++;
                            } else {
                                failedCount++;
                            }
                        });
                    }
                }

                // Validate any non-Wikimedia URLs (currently this covers the
                // direct Conor McGregor image) without requiring CORS access.
                if (directUrlFigures.length) {
                    const directResults = await Promise.all(
                        directUrlFigures.map(async figure => ({
                            figure,
                            valid: await probeImageUrl(String(figure.photoUrl || '').trim())
                        }))
                    );

                    directResults.forEach(result => {
                        if (result.valid) {
                            resolvedPersonPhotoCache.set(
                                result.figure.name,
                                String(result.figure.photoUrl || '').trim()
                            );
                            validatedCount++;
                        } else {
                            failedCount++;
                        }
                    });
                }

                allPersonPhotosPrevalidated = true;

                // Keep diagnostics in the console for development/debugging,
                // without showing startup messages to players.
                console.info(
                    `[Persondle] Photo pre-check complete: ${validatedCount} validated, ` +
                    `${repairedCount} repaired, ${failedCount} unavailable.`
                );
            })().catch(error => {
                console.warn('[Persondle] Photo pre-check could not complete:', error);
            });

            return allPersonPhotosPrevalidationPromise;
        }

        // Optional browser-side audit for development. Run
        // window.persondlePhotoAudit() from the console to verify every
        // database image from the player's actual network connection.
        // This is intentionally not run automatically because it would make
        // a large number of image requests during normal gameplay.
        window.persondlePhotoAudit = async function () {
            const results = [];

            for (const figure of figures) {
                const url = await getReliablePersonPhotoUrl(figure);
                const isFallback = url === PERSON_PHOTO_ERROR_FALLBACK;
                results.push({
                    name: figure.name,
                    photoUrl: isFallback ? '' : url,
                    working: !isFallback
                });
            }

            const failed = results.filter(result => !result.working);
            console.table(results);
            console.info(
                `[Persondle] Browser photo audit: ${results.length - failed.length}/${results.length} working, ${failed.length} fallback.`
            );
            return results;
        };

        // Start the full database photo pre-check once all photo-validation
        // helpers and caches have been initialized. Gameplay does not wait.
        prevalidateAllPersonPhotos();

        // Universal emergency image used whenever the intended Person of the Day
        // photo cannot be loaded or repaired. This guarantees the reveal never
        // ends with a broken-image icon.
        const PERSON_PHOTO_ERROR_FALLBACK =
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyJaNfcZdqzlz_TGnol1A9SsvU94pPy37QVQY_a-mHiGrkPM6toSo4E24M&s=10';

        async function getReliablePersonPhotoUrl(figure) {
            if (!figure || !figure.name) return PERSON_PHOTO_ERROR_FALLBACK;

            // Use a URL that has already been verified when available.
            if (resolvedPersonPhotoCache.has(figure.name)) {
                return resolvedPersonPhotoCache.get(figure.name);
            }

            // Give the original Wikimedia filename one direct, reliable chance.
            const directUrl = getPersonPhotoUrl(figure);
            if (directUrl) {
                const directWorks = await probeImageUrl(directUrl, 7000);
                if (directWorks) {
                    resolvedPersonPhotoCache.set(figure.name, directUrl);
                    return directUrl;
                }
            }

            // Then use the Commons API/repair system to find a verified image.
            const repairedUrl = await repairPersonPhoto(figure);
            if (repairedUrl) return repairedUrl;

            // Final Wikimedia Redirect endpoint fallback.
            const fallbackUrl = getPersonPhotoFallbackUrl(figure);
            if (fallbackUrl && await probeImageUrl(fallbackUrl, 7000)) {
                resolvedPersonPhotoCache.set(figure.name, fallbackUrl);
                return fallbackUrl;
            }

            // Last resort: use the universal technical-difficulties image.
            return PERSON_PHOTO_ERROR_FALLBACK;
        }

        function renderSecretPhoto() {
            const photoSlot = document.getElementById('secret-photo-slot');
            if (!photoSlot) return;
            photoSlot.innerHTML = '';

            const photoContainer = document.createElement('div');
            photoContainer.id = 'secret-photo-reveal';
            photoContainer.className = 'secret-photo-container photo-validating';

            const photo = document.createElement('img');
            photo.className = 'secret-photo';
            photo.alt = `${secretFigure.name} — Person of the Day`;
            photo.loading = 'eager';
            photo.decoding = 'async';

            const caption = document.createElement('div');
            caption.className = 'secret-photo-caption';
            caption.textContent = 'Person of the Day';

            const fallbackMessage = document.createElement('div');
            fallbackMessage.className = 'secret-photo-fallback';
            fallbackMessage.textContent = 'Loading photo…';

            photoContainer.appendChild(photo);
            photoContainer.appendChild(caption);
            photoContainer.appendChild(fallbackMessage);
            photoSlot.appendChild(photoContainer);

            let repairAttempted = false;

            const failPhoto = () => {
                photoContainer.classList.remove('photo-validating');
                photoContainer.classList.add('photo-load-failed');
                fallbackMessage.textContent = '';

                // Never leave a broken image on screen. If the intended person
                // photo fails through every repair path, show the supplied
                // technical-difficulties image instead.
                if (photo.src !== PERSON_PHOTO_ERROR_FALLBACK) {
                    photo.src = PERSON_PHOTO_ERROR_FALLBACK;
                }
            };

            // IMPORTANT: attach handlers BEFORE assigning src. A cached image can
            // finish loading immediately, which can otherwise bypass onload/onerror.
            photo.onload = () => {
                photoContainer.classList.remove('photo-validating', 'photo-load-failed');
                fallbackMessage.textContent = '';
            };

            photo.onerror = async () => {
                if (photo.src === PERSON_PHOTO_ERROR_FALLBACK) {
                    // The emergency image itself failed. There is nothing more
                    // reliable to display, so avoid an endless retry loop.
                    photo.removeAttribute('src');
                    photoContainer.classList.remove('photo-validating');
                    return;
                }

                if (repairAttempted) {
                    failPhoto();
                    return;
                }

                repairAttempted = true;
                photoContainer.classList.add('photo-validating');
                fallbackMessage.textContent = 'Repairing photo…';

                const repairedUrl = await repairPersonPhoto(secretFigure);

                if (repairedUrl) {
                    photo.src = repairedUrl;
                    return;
                }

                const fallbackUrl = getPersonPhotoFallbackUrl(secretFigure);
                if (fallbackUrl && photo.src !== fallbackUrl) {
                    photo.src = fallbackUrl;
                    return;
                }

                failPhoto();
            };

            // Resolve the photo asynchronously, but always keep the reveal area
            // present so a slow Commons response cannot make the game appear broken.
            getReliablePersonPhotoUrl(secretFigure)
                .then(url => {
                    if (url) {
                        photo.src = url;
                    } else {
                        failPhoto();
                    }
                })
                .catch(() => failPhoto());
        }

        /* =========================================================
           RENDER GUESS CARD

        /* =========================================================
           END GAME MESSAGES
           ========================================================= */

        function getEndGameMessage(
            attempts,
            won
        ) {

            if (!won) {

                const lossMessages = [

                    "Oof, 0 for 10. Don't worry, reading the news is always an option for tomorrow!",

                    "Tough luck! 10 guesses and still missed. Maybe pop culture just isn't your calling.",

                    "Well, at least you were consistent... consistently wrong! Better luck tomorrow.",

                    "Out of guesses! Go take a quick walk, clear your head, and try again tomorrow.",

                    "10 attempts, zero hits! The secret figure remains in the shadows until tomorrow.",

                    "A swing and a complete miss across all 10 tries! Time to do some light research."

                ];

                return lossMessages[
                    Math.floor(
                        Math.random() *
                        lossMessages.length
                    )
                ];

            }


            if (attempts === 1) {

                const oneMessages = [

                    "Hole in 1! Either you built this game, or you have telepathic powers.",

                    "On the VERY FIRST TRY?! Okay, genius, save some brain cells for the rest of us.",

                    "1/10! Pure psychic wizardry. You should play the lottery today."

                ];

                return oneMessages[
                    Math.floor(
                        Math.random() *
                        oneMessages.length
                    )
                ];

            } else if (attempts === 2) {

                const twoMessages = [

                    "Guessed in 2 tries! Absolutely clinical precision.",

                    "In just 2 attempts? That's practically a flex. Outstanding job!",

                    "2 guesses! Narrowed it down and closed the deal in seconds."

                ];

                return twoMessages[
                    Math.floor(
                        Math.random() *
                        twoMessages.length
                    )
                ];

            } else if (
                attempts >= 3 &&
                attempts <= 4
            ) {

                const threeFourMessages = [

                    `Got it in ${attempts}! Sharp deduction skills on display today.`,

                    `Winner in ${attempts} tries! Very clean gameplay, no panicking necessary.`,

                    `Only ${attempts} guesses needed! Smooth, logical, and quick.`

                ];

                return threeFourMessages[
                    Math.floor(
                        Math.random() *
                        threeFourMessages.length
                    )
                ];

            } else if (
                attempts >= 5 &&
                attempts <= 6
            ) {

                const fiveSixMessages = [

                    `Nail-biter territory! Solved in ${attempts} attempts. Nice recovery!`,

                    `Got there in ${attempts}! Took a few adjustments, but a win is a win.`,

                    `In ${attempts} guesses! Balanced deduction with a hint of dramatic suspense.`

                ];

                return fiveSixMessages[
                    Math.floor(
                        Math.random() *
                        fiveSixMessages.length
                    )
                ];

            } else if (
                attempts >= 7 &&
                attempts <= 8
            ) {

                const sevenEightMessages = [

                    `Whew! Solved on try #${attempts}. You were cutting it a bit close there!`,

                    `In ${attempts} attempts! A victory pulled right out of the fire.`,

                    `Took ${attempts} tries! The path was winding, but you reached the finish line.`

                ];

                return sevenEightMessages[
                    Math.floor(
                        Math.random() *
                        sevenEightMessages.length
                    )
                ];

            } else {

                const lateWinMessages = [

                    `Congrats! You eventually stumbled across the correct answer on try #${attempts}. We were starting to lose hope.`,

                    `You got it in ${attempts}! Only took almost every single try you had available.`,

                    `Winner in ${attempts} guesses! Though let's be honest, that was more of a brute-force victory than skill.`,

                    `On attempt #${attempts}! Defeated at the very edge of the cliff!`

                ];

                return lateWinMessages[
                    Math.floor(
                        Math.random() *
                        lateWinMessages.length
                    )
                ];

            }

        }


        /* =========================================================
           GAME OVER
           ========================================================= */

        function triggerGameOver(
            won,
            attempts
        ) {

            gameOver = true;

            endGameText.textContent =
                getEndGameMessage(
                    attempts,
                    won
                );

            endGameBox.className =
                `end-game-message ${
                    won ? 'win' : 'loss'
                }`;

            endGameBox.style.display =
                'block';

            input.disabled = true;

            submitBtn.disabled = true;

            suggestionsBox.style.display =
                'none';

            if (
                !won &&
                !document
                    .querySelector(
                        '.guess-card-header span'
                    )
                    ?.textContent
                    .includes(
                        'SECRET FIGURE'
                    )
            ) {

                renderGuessCard(
                    secretFigure,
                    true
                );

            }

            // Reveal the Person of the Day photo at the end of every round.
            // Because the final/reveal guess is inserted first, doing this
            // afterward places the photo immediately above that last guess.
            renderSecretPhoto();

        }


        /* =========================================================
           SUBMIT GUESS
           ========================================================= */

        function submitGuess() {

            if (gameOver) {
                return;
            }


            const guessName =
                input.value.trim();


            const figure =
                figures.find(
                    f =>
                        f.name
                            .toLowerCase() ===
                        guessName.toLowerCase()
                );


            if (!figure) {

                alert(
                    "Please select a valid figure from the dropdown list."
                );

                return;

            }


            if (
                guessedNames.has(
                    figure.name
                )
            ) {

                alert(
                    "You've already guessed this figure!"
                );

                return;

            }


            guessedNames.add(
                figure.name
            );

            guessHistoryObjects.push(
                figure
            );


            saveState();


            input.value = '';

            suggestionsBox.style.display =
                'none';


            const currentAttemptCount =
                guessedNames.size;


            guessCounterDisplay.textContent =
                `Guesses: ${currentAttemptCount} / ${maxGuesses}`;


            renderGuessCard(
                figure
            );


            if (
                figure.name ===
                secretFigure.name
            ) {

                triggerGameOver(
                    true,
                    currentAttemptCount
                );

                endGameBox.scrollIntoView({
                    behavior: 'smooth'
                });

            } else if (
                currentAttemptCount >=
                maxGuesses
            ) {

                triggerGameOver(
                    false,
                    currentAttemptCount
                );

                endGameBox.scrollIntoView({
                    behavior: 'smooth'
                });

            }

        }


// --- SEARCH / AUTOCOMPLETE ---

function getNameParts(name) {
    return name.trim().toLowerCase().split(/\s+/);
}

function nameMatchesSearch(name, query) {
    const cleanQuery = query.trim().toLowerCase();

    if (cleanQuery === '') {
        return true;
    }

    const nameParts = getNameParts(name);

    // If the user types multiple words, match the beginning
    // of the corresponding first/last name parts.
    const queryParts = cleanQuery.split(/\s+/);

    if (queryParts.length > 1) {
        return queryParts.every((queryPart, index) => {
            return nameParts[index] &&
                   nameParts[index].startsWith(queryPart);
        });
    }

    // Single letter/word:
    // Match the START of either the first name OR last name.
    return nameParts.some(part => part.startsWith(cleanQuery));
}


function showSuggestions() {

    if (gameOver) {
        suggestionsBox.style.display = 'none';
        return;
    }

    const query = input.value.trim().toLowerCase();

    suggestionsBox.innerHTML = '';

    const matches = figures.filter(function (figure) {

        return !guessedNames.has(figure.name) &&
               nameMatchesSearch(figure.name, query);

    });

    if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }

    matches.forEach(function (figure) {

        const suggestionItem = document.createElement('div');

        suggestionItem.className = 'suggestion-item';

        // Only display the person's name.
        suggestionItem.textContent = figure.name;

        /*
         * IMPORTANT:
         *
         * Do NOT use mousedown here.
         *
         * On mobile, mousedown fires immediately when the
         * user's finger touches the screen. That prevents
         * normal scrolling.
         *
         * Using click allows the browser to distinguish
         * between a tap and a swipe/scroll.
         */

        suggestionItem.addEventListener('click', function (event) {

            event.stopPropagation();

            input.value = figure.name;

            suggestionsBox.style.display = 'none';

            input.focus();

        });

        suggestionsBox.appendChild(suggestionItem);
    });

    suggestionsBox.style.display = 'block';
}


// Typing in the search box
input.addEventListener('input', function () {

    if (gameOver) {
        suggestionsBox.style.display = 'none';
        return;
    }

    showSuggestions();

});


// Tapping/focusing the search box opens the full list.
//
// This is what allows the player to simply tap the box
// and scroll through all available people without typing.
input.addEventListener('focus', function () {

    if (gameOver) return;

    showSuggestions();

});


// Clicking the input again should keep the list available.
input.addEventListener('click', function () {

    if (gameOver) return;

    showSuggestions();

});


// Close the dropdown when clicking outside the search area.
document.addEventListener('click', function (e) {

    if (!e.target.closest('.input-wrapper')) {
        suggestionsBox.style.display = 'none';
    }

});


// Submit button
submitBtn.addEventListener('click', submitGuess);


// Enter key
input.addEventListener('keydown', function (e) {

    if (e.key === 'Enter') {

        e.preventDefault();

        submitGuess();

    }

});



        /* =========================================================
           SHARE BUTTON
           ========================================================= */

        shareBtn.addEventListener(
            'click',
            function() {

                const resultStatus =
                    guessedNames.has(
                        secretFigure.name
                    )
                        ? `${guessedNames.size}/10`
                        : 'X/10';


                const emojiBlocks =
                    buildShareEmojiGrid();


                const gameUrl =
                    window.location.href;


                const scoreText =
                    `Persondle #${dayIndex + 1}: ${resultStatus}\n` +
                    `${emojiBlocks}\n\n` +
                    `Play todays round - ${gameUrl}`;


                if (
                    navigator.share
                ) {

                    navigator.share({
                        text: scoreText
                    });

                } else {

                    navigator.clipboard
                        .writeText(
                            scoreText
                        )
                        .then(
                            function() {

                                alert(
                                    "Score copied to clipboard!"
                                );

                            }
                        )
                        .catch(
                            function() {

                                alert(
                                    scoreText
                                );

                            }
                        );

                }

            }
        );

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historydle - 21st Century Icons</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000; /* Pure black background */
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; }
        .subtitle { color: #a0a0a2; margin-bottom: 25px; font-size: 0.95rem; text-align: center; }

        .game-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-box-row {
            display: flex;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #cccccc; }

        .suggestions {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 999;
            display: none; /* Hidden until user types */
        }

        .suggestion-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 1rem;
        }
        .suggestion-item:hover { background-color: #2a2a2b; }

        /* Grid layout for game rows */
        .grid-header, .guess-row {
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            gap: 6px;
            text-align: center;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .grid-header div { padding: 8px 0; color: #818384; text-transform: uppercase; letter-spacing: 0.5px; }

        .cell {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        /* Attribute state classes */
        .cell.correct { background-color: var(--green); border-color: var(--green); }
        .cell.partial { background-color: var(--yellow); border-color: var(--yellow); }
        .cell.wrong { background-color: #1a1a1c; border-color: var(--border-color); }

        .cell.name-cell { align-items: flex-start; padding-left: 12px; font-weight: 600; font-size: 0.95rem; }
        .cell span.emoji-icon { font-size: 1.3rem; margin-bottom: 4px; display: block; }
        .cell div.text-label { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; }

        .win-message {
            text-align: center;
            font-size: 1.6rem;
            color: #6aaa64;
            background-color: #121213;
            border: 2px solid var(--green);
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            font-weight: bold;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .share-btn:hover { background-color: #53934f; }
        
        .game-link-anchor { color: #5ab0ff; text-decoration: none; font-weight: bold; }
        .game-link-anchor:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>HISTORYDLE</h1>
    <div class="subtitle">Guess the 21st-century historical titan, business giant, or scientific mind.</div>

    <div class="game-container">
        <div class="search-box-row">
            <div class="input-wrapper">
                <input type="text" id="guess-input" placeholder="Type an influential figure's name..." autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
            <button id="submit-guess-btn" class="submit-btn">Guess</button>
        </div>

        <div id="win-message" class="win-message">
            <div>🎉 Incredible Job! You guessed the secret figure!</div>
            <button id="share-button" class="share-btn">Share Score 📋</button>
            <div style="margin-top: 15px; font-size: 0.9rem; color: #818384;">
                Play game at: <a class="game-link-anchor" href="https://github.io">AndrewsFirstGame</a>
            </div>
        </div>

        <div class="grid-header">
            <div>Name</div>
            <div>Arena</div>
            <div>Specialty / Field</div>
            <div>Country</div>
            <div>Birth State</div>
            <div>Gender</div>
            <div>Age</div>
        </div>

        <div id="guesses-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <script>
        // Attribute Icon Maps
        const arenaEmojis = {
            "Politics": "🏛️",
            "Business": "💼",
            "Science / Culture": "🔬"
        };

        const countryEmojis = {
            "USA": "🇺🇸", "South Africa": "🇿🇦", "UK": "🇬🇧", "Germany": "🇩🇪", 
            "India": "🇮🇳", "Australia": "🇦🇺", "Canada": "🇨🇦", "Ukraine": "🇺🇦"
        };

        function getDecadeEmoji(age) {
            if (age < 30) return "🧑";
            if (age < 40) return "👨";
            if (age < 50) return "🧔";
            if (age < 60) return "👨‍🦳";
            if (age < 70) return "👴";
            if (age < 80) return "🧓";
            return "🧙‍♂️";
        }

        // Full Master Database (45 Figures)
        const figures = [
            // --- POLITICS (15) ---
            { name: "Barack Obama", arena: "Politics", field: "President", country: "USA", state: "HI", gender: "Male", age: 65 },
            { name: "George W. Bush", arena: "Politics", field: "President", country: "USA", state: "CT", gender: "Male", age: 80 },
            { name: "Donald Trump", arena: "Politics", field: "President", country: "USA", state: "NY", gender: "Male", age: 80 },
            { name: "Joe Biden", arena: "Politics", field: "President", country: "USA", state: "PA", gender: "Male", age: 83 },
            { name: "Kamala Harris", arena: "Politics", field: "Vice Pres", country: "USA", state: "CA", gender: "Female", age: 61 },
            { name: "Nancy Pelosi", arena: "Politics", field: "Speaker", country: "USA", state: "MD", gender: "Female", age: 86 },
            { name: "Angela Merkel", arena: "Politics", field: "Chancellor", country: "Germany", state: "Hamburg", gender: "Female", age: 72 },
            { name: "Volodymyr Zelenskyy", arena: "Politics", field: "President", country: "Ukraine", state: "Kryvyi Rih", gender: "Male", age: 48 },
            { name: "Narendra Modi", arena: "Politics", field: "Prime Minister", country: "India", state: "Gujarat", gender: "Male", age: 76 },
            { name: "Rishi Sunak", arena: "Politics", field: "Prime Minister", country: "UK", state: "Hampshire", gender: "Male", age: 46 },
            { name: "John Roberts", arena: "Politics", field: "Judiciary", country: "USA", state: "NY", gender: "Male", age: 71 },
            { name: "Sonia Sotomayor", arena: "Politics", field: "Judiciary", country: "USA", state: "NY", gender: "Female", age: 72 },
            { name: "Mitt Romney", arena: "Politics", field: "Senator", country: "USA", state: "MI", gender: "Male", age: 79 },
            { name: "Bernie Sanders", arena: "Politics", field: "Senator", country: "USA", state: "NY", gender: "Male", age: 85 },
            { name: "Alexandria Ocasio-Cortez", arena: "Politics", field: "Congress", country: "USA", state: "NY", gender: "Female", age: 36 },

            // --- BUSINESS & TECH GIANTS (15) ---
            { name: "Elon Musk", arena: "Business", field: "Tech Exec", country: "South Africa", state: "Gauteng", gender: "Male", age: 55 },
            { name: "Bill Gates", arena: "Business", field: "Tech Exec", country: "USA", state: "WA", gender: "Male", age: 70 },
            { name: "Jeff Bezos", arena: "Business", field: "E-Commerce", country: "USA", state: "NM", gender: "Male", age: 62 },
            { name: "Mark Zuckerberg", arena: "Business", field: "Social Media", country: "USA", state: "NY", gender: "Male", age: 42 },
            { name: "Tim Cook", arena: "Business", field: "Tech Exec", country: "USA", state: "AL", gender: "Male", age: 65 },
            { name: "Satya Nadella", arena: "Business", field: "Tech Exec", country: "India", state: "Telangana", gender: "Male", age: 59 },
            { name: "Sundar Pichai", arena: "Business", field: "Tech Exec", country: "India", state: "Tamil Nadu", gender: "Male", age: 54 },
            { name: "Jensen Huang", arena: "Business", field: "Semiconductors", country: "USA", state: "Tainan", gender: "Male", age: 63 },
            { name: "Warren Buffett", arena: "Business", field: "Finance", country: "USA", state: "NE", gender: "Male", age: 96 },
            { name: "Jamie Dimon", arena: "Business", field: "Banking", country: "USA", state: "NY", gender: "Male", age: 70 },
            { name: "Sheryl Sandberg", arena: "Business", field: "Tech Exec", country: "USA", state: "DC", gender: "Female", age: 57 },
            { name: "Indra Nooyi", arena: "Business", field: "Consumer Goods", country: "India", state: "Tamil Nadu", gender: "Female", age: 70 },
            { name: "Sam Altman", arena: "Business", field: "AI Tech", country: "USA", state: "IL", gender: "Male", age: 41 },
            { name: "Rupert Murdoch", arena: "Business", field: "Media Mogul", country: "Australia", state: "Victoria", gender: "Male", age: 95 },
            { name: "Jack Dorsey", arena: "Business", field: "Fintech", country: "USA", state: "MO", gender: "Male", age: 49 },

            // --- SCIENCE, INNOVATION & CULTURE (15) ---
            { name: "Anthony Fauci", arena: "Science / Culture", field: "Medicine", country: "USA", state: "NY", gender: "Male", age: 85 },
            { name: "Jennifer Doudna", arena: "Science / Culture", field: "Genetics", country: "USA", state: "DC", gender: "Female", age: 62 },
            { name: "Katalin Karikó", arena: "Science / Culture", field: "Biochemistry", country: "USA", state: "Szolnok", gender: "Female", age: 71 },
            { name: "Neil deGrasse Tyson", arena: "Science / Culture", field: "Astrophysics", country: "USA", state: "NY", gender: "Male", age: 67 },
            { name: "Michio Kaku", arena: "Science / Culture", field: "Theoretical Phys", country: "USA", state: "CA", gender: "Male", age: 79 },
            { name: "Jane Goodall", arena: "Science / Culture", field: "Primatology", country: "UK", state: "London", gender: "Female", age: 92 },
            { name: "Tim Berners-Lee", arena: "Science / Culture", field: "Computer Science", country: "UK", state: "London", gender: "Male", age: 71 },
            { name: "Kip Thorne", arena: "Science / Culture", field: "Astrophysics", country: "USA", state: "UT", gender: "Male", age: 86 },
            { name: "Steven Pinker", arena: "Science / Culture", field: "Psychology", country: "Canada", state: "Quebec", gender: "Male", age: 72 },
            { name: "Terence Tao", arena: "Science / Culture", field: "Mathematics", country: "Australia", state: "South Australia", gender: "Male", age: 51 },
            { name: "Malala Yousafzai", arena: "Science / Culture", field: "Activism", country: "UK", state: "Khyber", gender: "Female", age: 29 },
            { name: "Greta Thunberg", arena: "Science / Culture", field: "Activism", country: "Sweden", state: "Stockholm", gender: "Female", age: 23 },
            { name: "Oprah Winfrey", arena: "Science / Culture", field: "Media Culture", country: "USA", state: "MS", gender: "Female", age: 72 },
            { name: "Jon Stewart", arena: "Science / Culture", field: "Media Commentary", country: "USA", state: "NY", gender: "Male", age: 63 },
            { name: "David Attenborough", arena: "Science / Culture", field: "Natural History", country: "UK", state: "Middlesex", gender: "Male", age: 100 }
        ];

        // Randomly select target figure for the game session
        const secretFigure = figures[Math.floor(Math.random() * figures.length)];

        const input = document.getElementById('guess-input');
        const suggestionsBox = document.getElementById('suggestions');
        const submitBtn = document.getElementById('submit-guess-btn');
        const guessesContainer = document.getElementById('guesses-container');
        const winMessage = document.getElementById('win-message');
        const shareBtn = document.getElementById('share-button');

        const guessedNames = new Set();
        let gameOver = false;

        // 1. Search Box Autocomplete Logic
        input.addEventListener('input', () => {
            if (gameOver) return;

            const query = input.value.trim().toLowerCase();
            suggestionsBox.innerHTML = '';

            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = figures.filter(f => 
                f.name.toLowerCase().includes(query) && !guessedNames.has(f.name)
            );

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.name;
                
                div.addEventListener('click', () => {
                    input.value = item.name;
                    suggestionsBox.style.display = 'none';
                    input.focus();
                });

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        });

        // Close dropdown when clicking outside input area
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-wrapper')) {
                suggestionsBox.style.display = 'none';
            }
        });

        // 2. Add Row to Grid
        function renderGuessRow(guess) {
            const row = document.createElement('div');
            row.className = 'guess-row';

            // Name Cell
            const nameCell = document.createElement('div');
            nameCell.className = 'cell name-cell';
            nameCell.textContent = guess.name;
            row.appendChild(nameCell);

            // Helper function to build attribute cell
            function createAttributeCell(value, targetValue, icon, isAge = false) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                let statusClass = 'wrong';

                if (value === targetValue) {
                    statusClass = 'correct';
                } else if (isAge) {
                    // Yellow if age is within 5 years
                    const diff = Math.abs(value - targetValue);
                    if (diff <= 5) {
                        statusClass = 'partial';
                    }
                }

                cell.classList.add(statusClass);

                let contentHtml = '';
                if (icon) {
                    contentHtml += `<span class="emoji-icon">${icon}</span>`;
                }
                
                let displayVal = value;
                if (isAge && value !== targetValue) {
                    displayVal += value < targetValue ? ' ⬆️' : ' ⬇️';
                }

                contentHtml += `<div class="text-label">${displayVal}</div>`;
                cell.innerHTML = contentHtml;

                return cell;
            }

            row.appendChild(createAttributeCell(guess.arena, secretFigure.arena, arenaEmojis[guess.arena]));
            row.appendChild(createAttributeCell(guess.field, secretFigure.field, null));
            row.appendChild(createAttributeCell(guess.country, secretFigure.country, countryEmojis[guess.country] || '🌐'));
            row.appendChild(createAttributeCell(guess.state, secretFigure.state, null));
            row.appendChild(createAttributeCell(guess.gender, secretFigure.gender, guess.gender === 'Male' ? '👨' : '👩'));
            row.appendChild(createAttributeCell(guess.age, secretFigure.age, getDecadeEmoji(guess.age), true));

            // Insert new guess at top of guess stack
            guessesContainer.insertBefore(row, guessesContainer.firstChild);
        }

        // 3. Process Guess Submission
        function submitGuess() {
            if (gameOver) return;

            const guessName = input.value.trim();
            const figure = figures.find(f => f.name.toLowerCase() === guessName.toLowerCase());

            if (!figure) {
                alert("Please select a valid figure from the dropdown list.");
                return;
            }

            if (guessedNames.has(figure.name)) {
                alert("You've already guessed this person!");
                return;
            }

            guessedNames.add(figure.name);
            input.value = '';
            suggestionsBox.style.display = 'none';

            renderGuessRow(figure);

            if (figure.name === secretFigure.name) {
                gameOver = true;
                winMessage.style.display = 'block';
                input.disabled = true;
                submitBtn.disabled = true;
            }
        }

        submitBtn.addEventListener('click', submitGuess);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitGuess();
            }
        });

        // 4. Share Score Button Handler
        shareBtn.addEventListener('click', () => {
            const scoreText = `I guessed ${secretFigure.name} in ${guessedNames.size} try/tries on Historydle! 🎯`;
            navigator.clipboard.writeText(scoreText).then(() => {
                alert("Score copied to clipboard!");
            }).catch(() => {
                alert(scoreText);
            });
        });
    </script>
</body>
</html>

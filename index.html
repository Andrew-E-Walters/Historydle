    function parseNumericValue(val) {

        if (typeof val === "number") {
            return val;
        }

        if (!val) {
            return 0;
        }

        const str =
            String(val)
                .trim()
                .toUpperCase()
                .replace(/\s+/g, "");

        let multiplier = 1;

        if (
            str.endsWith("B") ||
            str.endsWith("BN") ||
            str.endsWith("BILLION")
        ) {
            multiplier = 1e9;
        }

        else if (
            str.endsWith("M") ||
            str.endsWith("MN") ||
            str.endsWith("MILLION")
        ) {
            multiplier = 1e6;
        }

        else if (
            str.endsWith("K") ||
            str.endsWith("THOUSAND")
        ) {
            multiplier = 1e3;
        }

        const num =
            parseFloat(
                str.replace(/[^0-9.-]+/g, "")
            );

        return isNaN(num)
            ? 0
            : num * multiplier;
    }


    function createCell(
        title,
        value,
        targetValue,
        icon,
        type = "standard",
        isReveal = false
    ) {

        cell.className = "cell";

        const numValue =
            parseNumericValue(value);

        const numTarget =
            parseNumericValue(targetValue);

        let statusClass = "wrong";

        */

        if (type === "country") {

            if (value === targetValue) {

                countryContinents[targetValue]
            ) {

                statusClass = "partial";
            }
        }


        /*
        AGE
        */

        else if (type === "age") {

            if (numValue === numTarget) {

                statusClass = "correct";

            }

            else if (
                Math.abs(numValue - numTarget) <= 10
            ) {

                statusClass = "partial";
            }
        }


        /*
        FOLLOWERS
        */

        else if (type === "followers") {

            else if (

            ) {

            ) {

    const input =
        document.getElementById(
            "guess-input"
        );

    const suggestionsBox =
        document.getElementById(
            "suggestions"
        );

    const submitBtn =
        document.getElementById(
            "submit-guess-btn"
        );

    const guessesContainer =
        document.getElementById(
            "guesses-container"
        );

    const endGameBox =
        document.getElementById(
            "end-game-box"
        );

    const endGameText =
        document.getElementById(
            "end-game-text"
        );

    const shareBtn =
        document.getElementById(
            "share-button"
        );

    const guessCounterDisplay =
        document.getElementById(
            "guess-counter"
        );


    /*
    ================================================================
    GAME STATE
    ================================================================
    */

    const guessedNames =
        new Set();

    const guessHistoryObjects =
        [];

    let gameOver = false;


    /*
    ================================================================
    LOCAL STORAGE
    ================================================================
    */

    let savedData = {};

    try {

        savedData =
            JSON.parse(
                localStorage.getItem(
                    "persondle_state"
                ) || "{}"
            );

    }

    catch (error) {

        savedData = {};
    }


    if (
        savedData.date === todayStr &&
        Array.isArray(savedData.guesses)
    ) {

        savedData.guesses.forEach(
            name => {

                const figure =
                    figures.find(
                        f => f.name === name
                    );

                if (figure) {

                    guessedNames.add(
                        figure.name
                    );

                    guessHistoryObjects.push(
                        figure
                    );

                    renderGuessCard(
                        figure
                    );
                }
            }
        );


        guessCounterDisplay.textContent =
            `Guesses: ${guessedNames.size} / ${maxGuesses}`;


        if (
            guessedNames.has(
                secretFigure.name
            )
        ) {

            triggerGameOver(
                true,
                guessedNames.size
            );

        }

        else if (
            guessedNames.size >=
            maxGuesses
        ) {

            triggerGameOver(
                false,
                guessedNames.size
            );
        }

    }

    else {

        localStorage.setItem(
            "persondle_state",
            JSON.stringify({
                date: todayStr,
                guesses: []
            })
        );
    }


    function saveState() {

        localStorage.setItem(
            "persondle_state",
            JSON.stringify({

                date: todayStr,

                guesses:
                    Array.from(
                        guessedNames
                    )
            })
        );
    }


    /*
    ================================================================
    COUNTDOWN
    ================================================================
    */

    function updateCountdown() {

        const current =
            new Date();

        const tomorrow =
            new Date(
                current.getFullYear(),
                current.getMonth(),
                current.getDate() + 1
            );

        const diffMs =
            tomorrow - current;


        const hours =
            String(
                Math.floor(
                    (
                        diffMs /
                        (1000 * 60 * 60)
                    ) % 24
                )
            ).padStart(2, "0");


        const minutes =
            String(
                Math.floor(
                    (
                        diffMs /
                        (1000 * 60)
                    ) % 60
                )
            ).padStart(2, "0");


        const seconds =
            String(
                Math.floor(
                    diffMs /
                    1000
                ) % 60
            ).padStart(2, "0");


        document
            .getElementById("countdown")
            .textContent =
                `${hours}:${minutes}:${seconds}`;
    }


    setInterval(
        updateCountdown,
        1000
    );

    updateCountdown();


    /*
    ================================================================
    SHARE GRID
    ================================================================
    */

    function countGreenAttributes(
        guess,
        target
    ) {

        let greenCount = 0;

        if (
            guess.arena ===
            target.arena
        ) greenCount++;

        if (
            guess.netWorth ===
            target.netWorth
        ) greenCount++;

        if (
            guess.country ===
            target.country
        ) greenCount++;

        if (
            guess.followers ===
            target.followers
        ) greenCount++;

        if (
            guess.gender ===
            target.gender
        ) greenCount++;

        if (
            guess.age ===
            target.age
        ) greenCount++;

        return greenCount;
    }


    function buildShareEmojiGrid() {

        let emojiList = [];


        guessHistoryObjects.forEach(
            guess => {

                if (
                    guess.name ===
                    secretFigure.name
                ) {

                    emojiList.push("🟩");
                }

                else {

                    const greens =
                        countGreenAttributes(
                            guess,
                            secretFigure
                        );

                    if (greens >= 4) {

                        emojiList.push("🟨");

                    }

                    else {

                        emojiList.push("⬛");
                    }
                }
            }
        );


        return emojiList.join("");
    }


    /*
    ================================================================
    CLOSE SEARCH WHEN CLICKING OUTSIDE
    ================================================================
    */

    document.addEventListener(
        "click",
        function(event) {

            if (
                !event.target.closest(
                    ".input-wrapper"
                )
            ) {

                suggestionsBox.style.display =
                    "none";
            }
        }
    );


    /*
    ================================================================
    RENDER GUESS CARD
    ================================================================
    */

    function renderGuessCard(
        guess,
        isReveal = false
    ) {

        const card =
            document.createElement("div");

        card.className =
            "guess-card";


        const cardHeader =
            document.createElement("div");

        cardHeader.className =
            "guess-card-header";


        cardHeader.innerHTML =
            `<span>${
                isReveal
                    ? "SECRET FIGURE: "
                    : ""
            }${guess.name}</span>`;


        card.appendChild(
            cardHeader
        );


        const grid =
            document.createElement("div");

        grid.className =
            "attributes-grid";


        grid.appendChild(
            createCell(
                "Arena",
                guess.arena,
                secretFigure.arena,
                arenaEmojis[guess.arena] || "🌟",
                "standard",
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                "Net Worth",
                guess.netWorth,
                secretFigure.netWorth,
                "💵",
                "netWorth",
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                "Country",
                guess.country,
                secretFigure.country,
                countryEmojis[guess.country] || "🌐",
                "country",
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                "Followers",
                guess.followers,
                secretFigure.followers,
                "📱",
                "followers",
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                "Gender",
                guess.gender,
                secretFigure.gender,
                genderEmojis[guess.gender] || "",
                "standard",
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                "Age",
                guess.age,
                secretFigure.age,
                getAgeGroupEmoji(guess.age),
                "age",
                isReveal
            )
        );


        card.appendChild(grid);


        guessesContainer.insertBefore(
            card,
            guessesContainer.firstChild
        );
    }


    /*
    ================================================================
    END GAME MESSAGES
    ================================================================
    */

    function getEndGameMessage(
        attempts,
        won
    ) {

        if (!won) {

            const lossMessages = [

                "Oof, 0 for 10. Don't worry, reading the news is always an option for tomorrow!",

                "Tough luck! 10 guesses and still missed. Maybe pop culture just isn't your calling.",

                "Well, at least you were consistent... consistently wrong! Better luck tomorrow.",

                "Out of guesses! Go take a quick walk, clear your head, and try again tomorrow.",

                "10 attempts, zero hits! The secret figure remains in the shadows until tomorrow.",

                "A swing and a complete miss across all 10 tries! Time to do some light research."
            ];

            return lossMessages[
                Math.floor(
                    Math.random() *
                    lossMessages.length
                )
            ];
        }


        if (attempts === 1) {

            const messages = [

                "Hole in 1! Either you built this game, or you have telepathic powers.",

                "On the VERY FIRST TRY?! Okay, genius, save some brain cells for the rest of us.",

                "1/10! Pure psychic wizardry. You should play the lottery today."
            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (attempts === 2) {

            const messages = [

                "Guessed in 2 tries! Absolutely clinical precision.",

                "In just 2 attempts? That's practically a flex. Outstanding job!",

                "2 guesses! Narrowed it down and closed the deal in seconds."
            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 3 &&
            attempts <= 4
        ) {

            const messages = [

                `Got it in ${attempts}! Sharp deduction skills on display today.`,

                `Winner in ${attempts} tries! Very clean gameplay, no panicking necessary.`,

                `Only ${attempts} guesses needed! Smooth, logical, and quick.`
            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 5 &&
            attempts <= 6
        ) {

            const messages = [

                `Nail-biter territory! Solved in ${attempts} attempts. Nice recovery!`,

                `Got there in ${attempts}! Took a few adjustments, but a win is a win.`,

                `In ${attempts} guesses! Balanced deduction with a hint of dramatic suspense.`
            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 7 &&
            attempts <= 8
        ) {

            const messages = [

                `Whew! Solved on try #${attempts}. You were cutting it a bit close there!`,

                `In ${attempts} attempts! A victory pulled right out of the fire.`,

                `Took ${attempts} tries! The path was winding, but you reached the finish line.`
            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        const lateWinMessages = [

            `Congrats! You eventually stumbled across the correct answer on try #${attempts}. We were starting to lose hope.`,

            `You got it in ${attempts}! Only took almost every single try you had available.`,

            `Winner in ${attempts} guesses! Though let's be honest, that was more of a brute-force victory than skill.`,

            `On attempt #${attempts}! Defeated at the very edge of the cliff!`
        ];


        return lateWinMessages[
            Math.floor(
                Math.random() *
                lateWinMessages.length
            )
        ];
    }


    /*
    ================================================================
    GAME OVER
    ================================================================
    */

    function triggerGameOver(
        won,
        attempts
    ) {

        gameOver = true;


        endGameText.textContent =
            getEndGameMessage(
                attempts,
                won
            );


        endGameBox.className =
            `end-game-message ${
                won
                    ? "win"
                    : "loss"
            }`;


        endGameBox.style.display =
            "block";


        input.disabled = true;

        submitBtn.disabled = true;


        suggestionsBox.style.display =
            "none";


        /*
        Reveal answer after a loss.
        */

        if (!won) {

            const existingReveal =
                Array.from(
                    document.querySelectorAll(
                        ".guess-card-header"
                    )
                ).some(
                    header =>
                        header.textContent.includes(
                            "SECRET FIGURE"
                        )
                );


            if (!existingReveal) {

                renderGuessCard(
                    secretFigure,
                    true
                );
            }
        }
    }


    /*
    ================================================================
    SUBMIT GUESS
    ================================================================
    */

    function submitGuess() {

        if (gameOver) {
            return;
        }


        const guessName =
            input.value.trim();


        const figure =
            figures.find(
                f =>
                    f.name.toLowerCase() ===
                    guessName.toLowerCase()
            );


        if (!figure) {

            alert(
                "Please select a valid figure from the list."
            );

            return;
        }


        if (
            guessedNames.has(
                figure.name
            )
        ) {

            alert(
                "You've already guessed this figure!"
            );

            return;
        }


        guessedNames.add(
            figure.name
        );

        guessHistoryObjects.push(
            figure
        );


        saveState();


        input.value = "";

        suggestionsBox.style.display =
            "none";


        const currentAttemptCount =
            guessedNames.size;


        guessCounterDisplay.textContent =
            `Guesses: ${currentAttemptCount} / ${maxGuesses}`;


        renderGuessCard(
            figure
        );


        if (
            figure.name ===
            secretFigure.name
        ) {

            triggerGameOver(
                true,
                currentAttemptCount
            );

            endGameBox.scrollIntoView({
                behavior: "smooth"
            });

        }

        else if (
            currentAttemptCount >=
            maxGuesses
        ) {

            triggerGameOver(
                false,
                currentAttemptCount
            );

            endGameBox.scrollIntoView({
                behavior: "smooth"
            });
        }
    }


    /*
    ================================================================
    IMPORTANT:
    SPOTLE-STYLE NAME SEARCH
    ================================================================

    A search term is matched against the START of either the
    first name OR the last name.

    Examples:

    "G"
        George Washington
        Greta Thunberg

    "La"
        Larry Page

    "Pa"
        Larry Page

    "ar"
        DOES NOT match Larry Page

    "g"
        DOES NOT match Larry Page simply because Page contains g.
    ================================================================
    */

    function nameMatchesSearch(
        fullName,
        searchTerm
    ) {

        const normalizedName =
            fullName
                .toLowerCase()
                .trim();


        const normalizedSearch =
            searchTerm
                .toLowerCase()
                .trim();


        if (!normalizedSearch) {
            return true;
        }


        const nameParts =
            normalizedName.split(
                /\s+/
            );


        const firstName =
            nameParts[0] || "";


        const lastName =
            nameParts[nameParts.length - 1] || "";


        /*
        Match beginning of FIRST name
        OR beginning of LAST name.
        */

        return (
            firstName.startsWith(
                normalizedSearch
            )
            ||
            lastName.startsWith(
                normalizedSearch
            )
        );
    }


    /*
    ================================================================
    BUILD SEARCH RESULTS
    ================================================================
    */

    function getSearchMatches(
        query
    ) {

        return figures.filter(
            figure => {

                if (
                    guessedNames.has(
                        figure.name
                    )
                ) {

                    return false;
                }


                return nameMatchesSearch(
                    figure.name,
                    query
                );
            }
        );
    }


    /*
    ================================================================
    SHOW SEARCH RESULTS
    ================================================================
    */

    function showSuggestions(
        query
    ) {

        suggestionsBox.innerHTML = "";


        if (
            !query ||
            gameOver
        ) {

            suggestionsBox.style.display =
                "none";

            return;
        }


        const matches =
            getSearchMatches(
                query
            );


        if (
            matches.length === 0
        ) {

            suggestionsBox.style.display =
                "none";

            return;
        }


        matches.forEach(
            figure => {

                const suggestionItem =
                    document.createElement(
                        "div"
                    );


                suggestionItem.className =
                    "suggestion-item";


                suggestionItem.textContent =
                    figure.name;


                suggestionItem.setAttribute(
                    "role",
                    "option"
                );


                /*
                ====================================================
                MOUSE
                ====================================================
                */

                suggestionItem.addEventListener(
                    "mousedown",
                    function(event) {

                        /*
                        Prevent the input from losing focus
                        before selection.
                        */

                        event.preventDefault();
                    }
                );


                /*
                ====================================================
                TOUCH / MOBILE
                ====================================================

                pointerdown works much better than click for
                mobile dropdowns.

                ====================================================
                */

                suggestionItem.addEventListener(
                    "pointerdown",
                    function(event) {

                        /*
                        Only select when the user is actually
                        touching/clicking the item.

                        We don't prevent scrolling on the
                        suggestions container itself.
                        */

                        if (
                            event.pointerType ===
                            "touch"
                        ) {

                            event.preventDefault();
                        }


                        input.value =
                            figure.name;


                        suggestionsBox.style.display =
                            "none";


                        /*
                        Keep keyboard open on mobile.
                        */

                        setTimeout(
                            () => {

                                if (
                                    !gameOver
                                ) {

                                    input.focus();
                                }

                            },
                            0
                        );
                    }
                );


                /*
                Desktop click fallback.
                */

                suggestionItem.addEventListener(
                    "click",
                    function() {

                        input.value =
                            figure.name;

                        suggestionsBox.style.display =
                            "none";

                        input.focus();
                    }
                );


                suggestionsBox.appendChild(
                    suggestionItem
                );
            }
        );


        suggestionsBox.style.display =
            "block";
    }


    /*
    ================================================================
    SEARCH INPUT
    ================================================================
    */

    input.addEventListener(
        "input",
        function() {

            if (gameOver) {

                suggestionsBox.style.display =
                    "none";

                return;
            }


            const query =
                this.value.trim();


            showSuggestions(
                query
            );
        }
    );


    /*
    ================================================================
    FOCUS INPUT
    ================================================================
    */

    input.addEventListener(
        "focus",
        function() {

            if (
                gameOver
            ) {
                return;
            }


            const query =
                this.value.trim();


            if (query) {

                showSuggestions(
                    query
                );
            }
        }
    );


    /*
    ================================================================
    KEYBOARD
    ================================================================
    */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                submitGuess();

                return;
            }


            /*
            Escape closes the list.
            */

            if (
                event.key ===
                "Escape"
            ) {

                suggestionsBox.style.display =
                    "none";
            }
        }
    );


    /*
    ================================================================
    SUBMIT BUTTON
    ================================================================
    */

    submitBtn.addEventListener(
        "click",
        submitGuess
    );


    /*
    ================================================================
    SHARE
    ================================================================
    */

    shareBtn.addEventListener(
        "click",
        function() {

            const resultStatus =
                guessedNames.has(
                    secretFigure.name
                )
                ?
                `${guessedNames.size}/10`
                :
                "X/10";


            const emojiBlocks =
                buildShareEmojiGrid();


            const gameUrl =
                window.location.href;


            const scoreText =
                `Persondle #${dayIndex + 1}: ${resultStatus}\n` +
                `${emojiBlocks}\n\n` +
                `Play today's round - ${gameUrl}`;


            if (
                navigator.share
            ) {

                navigator.share({
                    text: scoreText
                });

            }

            else if (
                navigator.clipboard
            ) {

                navigator.clipboard
                    .writeText(
                        scoreText
                    )
                    .then(
                        () => {

                            alert(
                                "Score copied to clipboard!"
                            );
                        }
                    )
                    .catch(
                        () => {

                            alert(
                                scoreText
                            );
                        }
                    );

            }

            else {

                alert(
                    scoreText
                );
            }
        }
    );


    /*
    ================================================================
    MOBILE KEYBOARD / VIEWPORT HANDLING
    ================================================================

    When the keyboard opens, keep the search field visible instead
    of allowing the dropdown to get pushed off screen.
    ================================================================
    */

    if (
        window.visualViewport
    ) {

        window.visualViewport.addEventListener(
            "resize",
            function() {

                if (
                    document.activeElement ===
                    input
                ) {

                    setTimeout(
                        function() {

                            input.scrollIntoView({
                                behavior: "smooth",
                                block: "center"
                            });

                        },
                        50
                    );
                }
            }
        );
    }


    /*
    ================================================================
    PREVENT ACCIDENTAL PAGE SCROLL WHEN SWIPING INSIDE THE LIST
    ================================================================

    We deliberately DO NOT use preventDefault here.

    The browser needs the native touch scrolling behavior for the
    dropdown. The CSS `touch-action: pan-y` and
    `-webkit-overflow-scrolling: touch` handle the mobile scrolling.
    ================================================================
    */


</script>

</body>

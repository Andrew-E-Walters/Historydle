<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historydle - 21st Century Icons</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000;
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; }
        .subtitle { color: #a0a0a2; margin-bottom: 25px; font-size: 0.95rem; text-align: center; }

        .game-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-box-row {
            display: flex;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #cccccc; }

        .suggestions {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 999;
            display: none;
        }

        .suggestion-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 1rem;
        }
        .suggestion-item:hover { background-color: #2a2a2b; }

        .grid-header, .guess-row {
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            gap: 6px;
            text-align: center;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .grid-header div { padding: 8px 0; color: #818384; text-transform: uppercase; letter-spacing: 0.5px; }

        .cell {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .cell.correct { background-color: var(--green); border-color: var(--green); }
        .cell.partial { background-color: var(--yellow); border-color: var(--yellow); }
        .cell.wrong { background-color: #1a1a1c; border-color: var(--border-color); }

        .cell.name-cell { align-items: flex-start; padding-left: 12px; font-weight: 600; font-size: 0.95rem; }
        .cell span.emoji-icon { font-size: 1.4rem; margin-bottom: 4px; display: block; line-height: 1; }
        .cell div.text-label { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .win-message {
            text-align: center;
            font-size: 1.6rem;
            color: #6aaa64;
            background-color: #121213;
            border: 2px solid var(--green);
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            font-weight: bold;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .share-btn:hover { background-color: #53934f; }
        
        .game-link-anchor { color: #5ab0ff; text-decoration: none; font-weight: bold; }
        .game-link-anchor:hover { text-decoration: underline; }
    </style>
</head>

        const secretFigure = figures[Math.floor(Math.random() * figures.length)];

        const input = document.getElementById('guess-input');

        const submitBtn = document.getElementById('submit-guess-btn');
        const guessesContainer = document.getElementById('guesses-container');
        const winMessage = document.getElementById('win-message');
        const shareBtn = document.getElementById('share-button');

        const guessedNames = new Set();
        let gameOver = false;

        input.addEventListener('input', () => {
            if (gameOver) return;

            const query = input.value.trim().toLowerCase();
            suggestionsBox.innerHTML = '';

            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = figures.filter(f => 
                f.name.toLowerCase().includes(query) && !guessedNames.has(f.name)
            );

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.name;
                
                div.addEventListener('click', () => {
                    input.value = item.name;
                    suggestionsBox.style.display = 'none';
                    input.focus();
                });

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-wrapper')) {
                suggestionsBox.style.display = 'none';
            }
        });

        function renderGuessRow(guess) {
            const row = document.createElement('div');
            row.className = 'guess-row';

            const nameCell = document.createElement('div');
            nameCell.className = 'cell name-cell';
            nameCell.textContent = guess.name;
            row.appendChild(nameCell);

            function createAttributeCell(value, targetValue, icon, type = 'standard') {
                const cell = document.createElement('div');
                cell.className = 'cell';

                let statusClass = 'wrong';

                if (type === 'country') {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    } else if (countryContinents[value] === countryContinents[targetValue]) {
                        statusClass = 'partial'; // Same continent match
                    }
                } else if (type === 'age') {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    } else if (Math.abs(value - targetValue) <= 10) {
                        statusClass = 'partial'; // Within 10 years match
                    }
                } else {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    }
                }

                cell.classList.add(statusClass);

                let contentHtml = '';
                if (icon) {
                    contentHtml += `<span class="emoji-icon">${icon}</span>`;
                }
                
                let displayVal = value;
                if (type === 'age' && value !== targetValue) {
                    displayVal += value < targetValue ? ' ⬆️' : ' ⬇️';
                }

                contentHtml += `<div class="text-label">${displayVal}</div>`;
                cell.innerHTML = contentHtml;

                return cell;
            }

            row.appendChild(createAttributeCell(guess.arena, secretFigure.arena, arenaEmojis[guess.arena] || '🌟'));
            row.appendChild(createAttributeCell(guess.field, secretFigure.field, "🎯"));
            row.appendChild(createAttributeCell(guess.country, secretFigure.country, countryEmojis[guess.country] || '🌐', 'country'));
            row.appendChild(createAttributeCell(guess.state, secretFigure.state, "📍"));
            row.appendChild(createAttributeCell(guess.gender, secretFigure.gender, genderEmojis[guess.gender]));
            row.appendChild(createAttributeCell(guess.age, secretFigure.age, getAgeGroupEmoji(guess.age), 'age'));

            guessesContainer.insertBefore(row, guessesContainer.firstChild);
        }

        function submitGuess() {
            if (gameOver) return;

            const guessName = input.value.trim();
            const figure = figures.find(f => f.name.toLowerCase() === guessName.toLowerCase());

            if (!figure) {
                alert("Please select a valid figure from the dropdown list.");
                return;
            }

            if (guessedNames.has(figure.name)) {
                alert("You've already guessed this person!");
                return;
            }

            guessedNames.add(figure.name);
            input.value = '';
            suggestionsBox.style.display = 'none';

            renderGuessRow(figure);

            if (figure.name === secretFigure.name) {
                gameOver = true;
                winMessage.style.display = 'block';
                input.disabled = true;
                submitBtn.disabled = true;
            }
        }

        submitBtn.addEventListener('click', submitGuess);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitGuess();
            }
        });

        shareBtn.addEventListener('click', () => {
            const scoreText = `I guessed ${secretFigure.name} in ${guessedNames.size} try/tries on Historydle! 🎯`;
            navigator.clipboard.writeText(scoreText).then(() => {
                alert("Score copied to clipboard!");
            }).catch(() => {
                alert(scoreText);
            });
        });
    </script>
</body>

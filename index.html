            background-color: var(--bg-color);

            padding-top: 4px;
            padding-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            min-width: 0;
        }

            width: 100%;

            background-color: var(--card-bg);

            border: 2px solid var(--border-color);

            color: var(--text-color);

            border-radius: 8px;

            outline: none;

            -webkit-appearance: none;

        }

        input:focus {
            border-color: #818384;
        }

        input:disabled {
            background-color: #1a1a1c;
            color: #555555;
            cursor: not-allowed;
        }

            background-color: #ffffff;
            color: #000000;

            border: none;

            padding: 0 16px;

            font-size: 0.95rem;
            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            text-transform: uppercase;

            min-height: 44px;

            flex-shrink: 0;
        }

        .submit-btn:active {
            background-color: #cccccc;
        }

        .submit-btn:disabled {
            background-color: #3a3a3c;
            color: #777777;
            cursor: not-allowed;
        }

        /* =========================================
           SPOTLE STYLE PERSON PICKER
        ========================================= */

        .suggestions {
            position: absolute;

            top: calc(100% + 5px);
            left: 0;
            right: 0;

            background-color: #161617;

            border: 2px solid var(--border-color);

            border-radius: 10px;

            max-height: 280px;

            overflow-y: auto;
            overflow-x: hidden;

            z-index: 5000;

            display: none;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.8),
                0 3px 10px rgba(0, 0, 0, 0.5);

            -webkit-overflow-scrolling: touch;

            overscroll-behavior: contain;

            scrollbar-width: thin;
            scrollbar-color: #555 #161617;
        }

        .suggestions::-webkit-scrollbar {
            width: 7px;
        }

        .suggestions::-webkit-scrollbar-track {
            background: #161617;
        }

        .suggestions::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        .suggestion-item {
            min-height: 48px;

            padding: 13px 14px;

            cursor: pointer;

            border-bottom: 1px solid #2b2b2d;

            color: #ffffff;

            text-align: left;

            font-size: 0.95rem;

            display: flex;

            align-items: center;

            transition:

            user-select: none;

            -webkit-user-select: none;
        }

        }

            background-color: #272729;
        }

        }

        ========================================= */

            padding: 10px;

            flex-direction: column;

            gap: 8px;

    /* =========================================

    ========================================= */

    function parseNumericValue(val) {

        if (typeof val === 'number') {
            return val;
        }

        if (!val) {
            return 0;
        }

        const str =
            String(val)
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '');

        let multiplier = 1;

        if (
            str.endsWith('B') ||
            str.endsWith('BN') ||
            str.endsWith('BILLION')
        ) {
            multiplier = 1e9;

        } else if (
            str.endsWith('M') ||
            str.endsWith('MN') ||
            str.endsWith('MILLION')
        ) {
            multiplier = 1e6;

        } else if (
            str.endsWith('K') ||
            str.endsWith('THOUSAND')
        ) {
            multiplier = 1e3;
        }

        const num =
            parseFloat(
                str.replace(/[^0-9.-]+/g, "")
            );

        return isNaN(num)
            ? 0
            : num * multiplier;
    }


    function createCell(
        title,
        value,
        targetValue,
        icon,
        type = 'standard',
        isReveal = false
    ) {

        const cell =

        cell.className = 'cell';

        const numValue =
            parseNumericValue(value);

        const numTarget =
            parseNumericValue(targetValue);

        let statusClass = 'wrong';


        if (type === 'country') {

            if (value === targetValue) {

                statusClass = 'correct';

            } else if (
                countryContinents[value] &&
                countryContinents[value] ===

            ) {

                statusClass = 'partial';

            }

        }

        else if (type === 'age') {

            if (numValue === numTarget) {

                statusClass = 'correct';

            } else if (
                Math.abs(numValue - numTarget) <= 10
            ) {

                statusClass = 'partial';

            }

        }

        else if (type === 'followers') {

            if (numValue === numTarget) {

                statusClass = 'correct';

            } else if (
                Math.abs(numValue - numTarget) <=
                    (numTarget * 0.3) ||
                Math.abs(numValue - numTarget) <=
                    300000
            ) {

                statusClass = 'partial';

            }

        }

        else if (type === 'netWorth') {

            if (
                numValue === numTarget ||
                Math.abs(numValue - numTarget) <=
                    (numTarget * 0.15) ||
                Math.abs(numValue - numTarget) <=

            ) {

                    (numTarget * 0.3) ||
                Math.abs(numValue - numTarget) <=
                    40000000
            ) {

        else {

                String(value).trim().toLowerCase() ===

            ) {

                statusClass = 'correct';

            numValue !== numTarget &&
            !isReveal
        ) {

            'guesses-container'
        );

    const endGameBox =
        document.getElementById(
            'end-game-box'
        );

    const endGameText =
        document.getElementById(
            'end-game-text'
        );

    const shareBtn =
        document.getElementById(
            'share-button'
        );

    const guessCounterDisplay =
        document.getElementById(
            'guess-counter'
        );


    /* =========================================
       GAME STATE
    ========================================= */

    const guessedNames =
        new Set();

    const guessHistoryObjects =
        [];

    let gameOver = false;

    let currentMatches = [];

    let highlightedIndex = -1;


    /* =========================================
       LOCAL STORAGE
    ========================================= */

    const savedData =
        JSON.parse(
            localStorage.getItem(
                'persondle_state'
            ) || '{}'
        );


    if (
        savedData.date === todayStr &&
        Array.isArray(savedData.guesses)
    ) {

        savedData.guesses.forEach(name => {

            const figure =
                figures.find(
                    f => f.name === name
                );

            if (figure) {

                guessedNames.add(
                    figure.name
                );

                guessHistoryObjects.push(
                    figure
                );

                renderGuessCard(figure);
            }

        });


        guessCounterDisplay.textContent =
            `Guesses: ${guessedNames.size} / ${maxGuesses}`;


        if (
            guessedNames.has(
                secretFigure.name
            )
        ) {

            triggerGameOver(
                true,
                guessedNames.size
            );

        }

        else if (
            guessedNames.size >=
            maxGuesses
        ) {

            triggerGameOver(
                false,
                guessedNames.size
            );
        }

    }

    else {

        localStorage.setItem(
            'persondle_state',
            JSON.stringify({
                date: todayStr,
                guesses: []
            })
        );
    }


    function saveState() {

        localStorage.setItem(
            'persondle_state',
            JSON.stringify({
                date: todayStr,
                guesses:
                    Array.from(guessedNames)
            })
        );
    }


    /* =========================================
       COUNTDOWN
    ========================================= */

    function updateCountdown() {

        const now =
            new Date();

        const tomorrow =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate() + 1
            );

        const diffMs =
            tomorrow - now;

        const hours =
            String(
                Math.floor(
                    (
                        diffMs /
                        (1000 * 60 * 60)
                    ) % 24
                )
            ).padStart(2, '0');

        const minutes =
            String(
                Math.floor(
                    (
                        diffMs /
                        (1000 * 60)
                    ) % 60
                )
            ).padStart(2, '0');

        const seconds =
            String(
                Math.floor(
                    diffMs / 1000
                ) % 60
            ).padStart(2, '0');


        document
            .getElementById('countdown')
            .textContent =
                `${hours}:${minutes}:${seconds}`;
    }


    setInterval(
        updateCountdown,
        1000
    );

    updateCountdown();


    /* =========================================
       GUESS CARD
    ========================================= */

    function renderGuessCard(
        guess,
        isReveal = false
    ) {

        const card =
            document.createElement('div');

        card.className =
            'guess-card';


        const cardHeader =
            document.createElement('div');

        cardHeader.className =
            'guess-card-header';


        cardHeader.innerHTML =
            `<span>${
                isReveal
                    ? 'SECRET FIGURE: '
                    : ''
            }${guess.name}</span>`;


        card.appendChild(
            cardHeader
        );


        const grid =
            document.createElement('div');

        grid.className =
            'attributes-grid';


        grid.appendChild(
            createCell(
                'Arena',
                guess.arena,
                secretFigure.arena,
                arenaEmojis[guess.arena] || '🌟',
                'standard',
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                'Net Worth',
                guess.netWorth,
                secretFigure.netWorth,
                '💵',
                'netWorth',
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                'Country',
                guess.country,
                secretFigure.country,
                countryEmojis[guess.country] || '🌐',
                'country',
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                'Followers',
                guess.followers,
                secretFigure.followers,
                '📱',
                'followers',
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                'Gender',
                guess.gender,
                secretFigure.gender,
                genderEmojis[guess.gender] || '',
                'standard',
                isReveal
            )
        );


        grid.appendChild(
            createCell(
                'Age',
                guess.age,
                secretFigure.age,
                getAgeGroupEmoji(guess.age),
                'age',
                isReveal
            )
        );


        card.appendChild(
            grid
        );


        guessesContainer.insertBefore(
            card,
            guessesContainer.firstChild
        );
    }


    /* =========================================
       END GAME MESSAGE
    ========================================= */

    function getEndGameMessage(
        attempts,
        won
    ) {

        if (!won) {

            const lossMessages = [

                "Oof, 0 for 10. Don't worry, reading the news is always an option for tomorrow!",

                "Tough luck! 10 guesses and still missed. Maybe pop culture just isn't your calling.",

                "Well, at least you were consistent... consistently wrong! Better luck tomorrow.",

                "Out of guesses! Go take a quick walk, clear your head, and try again tomorrow.",

                "10 attempts, zero hits! The secret figure remains in the shadows until tomorrow.",

                "A swing and a complete miss across all 10 tries! Time to do some light research."

            ];

            return lossMessages[
                Math.floor(
                    Math.random() *
                    lossMessages.length
                )
            ];
        }


        if (attempts === 1) {

            const messages = [

                "Hole in 1! Either you built this game, or you have telepathic powers.",

                "On the VERY FIRST TRY?! Okay, genius, save some brain cells for the rest of us.",

                "1/10! Pure psychic wizardry. You should play the lottery today."

            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (attempts === 2) {

            const messages = [

                "Guessed in 2 tries! Absolutely clinical precision.",

                "In just 2 attempts? That's practically a flex. Outstanding job!",

                "2 guesses! Narrowed it down and closed the deal in seconds."

            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 3 &&
            attempts <= 4
        ) {

            const messages = [

                `Got it in ${attempts}! Sharp deduction skills on display today.`,

                `Winner in ${attempts} tries! Very clean gameplay, no panicking necessary.`,

                `Only ${attempts} guesses needed! Smooth, logical, and quick.`

            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 5 &&
            attempts <= 6
        ) {

            const messages = [

                `Nail-biter territory! Solved in ${attempts} attempts. Nice recovery!`,

                `Got there in ${attempts}! Took a few adjustments, but a win is a win.`,

                `In ${attempts} guesses! Balanced deduction with a hint of dramatic suspense.`

            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        if (
            attempts >= 7 &&
            attempts <= 8
        ) {

            const messages = [

                `Whew! Solved on try #${attempts}. You were cutting it a bit close there!`,

                `In ${attempts} attempts! A victory pulled right out of the fire.`,

                `Took ${attempts} tries! The path was winding, but you reached the finish line.`

            ];

            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];
        }


        const messages = [

            `Congrats! You eventually stumbled across the correct answer on try #${attempts}. We were starting to lose hope.`,

            `You got it in ${attempts}! Only took almost every single try you had available.`,

            `Winner in ${attempts} guesses! Though let's be honest, that was more of a brute-force victory than skill.`,

            `On attempt #${attempts}! Defeated at the very edge of the cliff!`

        ];

        return messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];
    }


    function triggerGameOver(
        won,
        attempts
    ) {

        gameOver = true;


        endGameText.textContent =
            getEndGameMessage(
                attempts,
                won
            );


        endGameBox.className =
            `end-game-message ${
                won
                    ? 'win'
                    : 'loss'
            }`;


        endGameBox.style.display =
            'block';


        input.disabled = true;

        submitBtn.disabled = true;


        closePicker();


        if (
            !won &&
            !document.querySelector(
                '.guess-card-header span'
            )?.textContent
                .includes(
                    'SECRET FIGURE'
                )
        ) {

            renderGuessCard(
                secretFigure,
                true
            );
        }
    }


    /* =========================================
       SUBMIT GUESS
    ========================================= */

    function submitGuess() {

        if (gameOver) {
            return;
        }


        const guessName =
            input.value.trim();


        const figure =
            figures.find(
                f =>
                    f.name.toLowerCase() ===
                    guessName.toLowerCase()
            );


        if (!figure) {

            /*
             * If there is a highlighted person,
             * select them automatically.
             */

            if (
                currentMatches.length &&
                highlightedIndex >= 0 &&
                currentMatches[
                    highlightedIndex
                ]
            ) {

                selectFigure(
                    currentMatches[
                        highlightedIndex
                    ]
                );

                return;
            }


            /*
             * Otherwise open the picker.
             */

            openPicker();

            return;
        }


        makeGuess(
            figure
        );
    }


    function makeGuess(figure) {

        if (gameOver) {
            return;
        }


        if (
            guessedNames.has(
                figure.name
            )
        ) {

            alert(
                "You've already guessed this figure!"
            );

            return;
        }


        guessedNames.add(
            figure.name
        );

        guessHistoryObjects.push(
            figure
        );


        saveState();


        input.value = '';

        closePicker();


        const currentAttemptCount =
            guessedNames.size;


        guessCounterDisplay.textContent =
            `Guesses: ${currentAttemptCount} / ${maxGuesses}`;


        renderGuessCard(
            figure
        );


        if (
            figure.name ===
            secretFigure.name
        ) {

            triggerGameOver(
                true,
                currentAttemptCount
            );

            endGameBox.scrollIntoView({
                behavior: 'smooth'
            });

        }

        else if (
            currentAttemptCount >=
            maxGuesses
        ) {

            triggerGameOver(
                false,
                currentAttemptCount
            );

            endGameBox.scrollIntoView({
                behavior: 'smooth'
            });
        }
    }


    /* =========================================
       SPOTLE-STYLE PERSON PICKER
    ========================================= */

    function getAvailableFigures(
        query = ''
    ) {

        const normalizedQuery =
            query.trim().toLowerCase();


        return figures.filter(
            figure => {

                if (
                    guessedNames.has(
                        figure.name
                    )
                ) {
                    return false;
                }


                if (
                    normalizedQuery === ''
                ) {
                    return true;
                }


                return figure.name
                    .toLowerCase()
                    .includes(
                        normalizedQuery
                    );
            }
        );
    }


    function openPicker() {

        if (gameOver) {
            return;
        }


        renderSuggestions(
            input.value
        );


        suggestionsBox.style.display =
            'block';
    }


    function closePicker() {

        suggestionsBox.style.display =
            'none';

        currentMatches = [];

        highlightedIndex = -1;
    }


    function renderSuggestions(
        query = ''
    ) {

        if (gameOver) {
            return;
        }


        currentMatches =
            getAvailableFigures(
                query
            );


        highlightedIndex = -1;


        suggestionsBox.innerHTML =
            '';


        /*
         * Header makes the list feel like
         * a proper searchable selector.
         */

        const header =
            document.createElement(
                'div'
            );

        header.className =
            'picker-header';

        header.textContent =
            query.trim()
                ? `${currentMatches.length} result${
                    currentMatches.length === 1
                        ? ''
                        : 's'
                }`
                : `${currentMatches.length} figures`;

        suggestionsBox.appendChild(
            header
        );


        if (
            currentMatches.length === 0
        ) {

            const noResults =
                document.createElement(
                    'div'
                );

            noResults.className =
                'no-results';

            noResults.textContent =
                'No figures found';

            suggestionsBox.appendChild(
                noResults
            );

            suggestionsBox.style.display =
                'block';

            return;
        }


        currentMatches.forEach(
            (figure, index) => {

                const item =
                    document.createElement(
                        'div'
                    );


                item.className =
                    'suggestion-item';


                item.setAttribute(
                    'role',
                    'option'
                );


                item.dataset.index =
                    index;


                const name =
                    document.createElement(
                        'span'
                    );

                name.className =
                    'suggestion-name';

                name.textContent =
                    figure.name;


                const number =
                    document.createElement(
                        'span'
                    );

                number.className =
                    'suggestion-number';

                number.textContent =
                    index + 1;


                item.appendChild(
                    name
                );

                item.appendChild(
                    number
                );


                /*
                 * Pointerdown is more reliable than
                 * click on mobile because it avoids
                 * the input losing focus first.
                 */

                item.addEventListener(
                    'pointerdown',
                    function(event) {

                        event.preventDefault();

                        selectFigure(
                            figure
                        );
                    }
                );


                item.addEventListener(
                    'mouseenter',
                    function() {

                        setHighlight(
                            index
                        );
                    }
                );


                suggestionsBox.appendChild(
                    item
                );
            }
        );


        suggestionsBox.style.display =
            'block';
    }


    function selectFigure(
        figure
    ) {

        if (
            !figure ||
            gameOver
        ) {
            return;
        }


        input.value =
            figure.name;


        closePicker();


        input.focus();
    }


    function setHighlight(
        index
    ) {

        const items =
            suggestionsBox.querySelectorAll(
                '.suggestion-item'
            );


        items.forEach(
            item =>
                item.classList.remove(
                    'highlighted'
                )
        );


        if (
            index < 0 ||
            index >= items.length
        ) {

            highlightedIndex = -1;

            return;
        }


        highlightedIndex =
            index;


        const item =
            items[index];


        item.classList.add(
            'highlighted'
        );


        /*
         * Makes keyboard navigation work
         * naturally with the scrollable list.
         */

        item.scrollIntoView({
            block: 'nearest'
        });
    }


    /* =========================================
       SEARCH INPUT
    ========================================= */

    input.addEventListener(
        'focus',
        function() {

            if (gameOver) {
                return;
            }


            /*
             * Opening the picker with no query
             * gives the user a complete scrollable
             * list, just like a player selector.
             */

            renderSuggestions(
                input.value
            );

            suggestionsBox.style.display =
                'block';
        }
    );


    input.addEventListener(
        'input',
        function() {

            if (gameOver) {
                closePicker();
                return;
            }


            renderSuggestions(
                this.value
            );
        }
    );


    /* =========================================
       KEYBOARD NAVIGATION
    ========================================= */

    input.addEventListener(
        'keydown',
        function(event) {

            if (gameOver) {
                return;
            }


            const isOpen =
                suggestionsBox.style.display ===
                'block';


            /*
             * Arrow Down
             */

            if (
                event.key === 'ArrowDown'
            ) {

                event.preventDefault();


                if (!isOpen) {

                    openPicker();

                    return;
                }


                if (
                    currentMatches.length === 0
                ) {
                    return;
                }


                let nextIndex =
                    highlightedIndex + 1;


                if (
                    nextIndex >=
                    currentMatches.length
                ) {

                    nextIndex = 0;
                }


                setHighlight(
                    nextIndex
                );

                return;
            }


            /*
             * Arrow Up
             */

            if (
                event.key === 'ArrowUp'
            ) {

                event.preventDefault();


                if (!isOpen) {

                    openPicker();

                    return;
                }


                if (
                    currentMatches.length === 0
                ) {
                    return;
                }


                let nextIndex =
                    highlightedIndex - 1;


                if (
                    nextIndex < 0
                ) {

                    nextIndex =
                        currentMatches.length - 1;
                }


                setHighlight(
                    nextIndex
                );

                return;
            }


            /*
             * Enter
             */

            if (
                event.key === 'Enter'
            ) {

                event.preventDefault();


                if (
                    highlightedIndex >= 0 &&
                    currentMatches[
                        highlightedIndex
                    ]
                ) {

                    selectFigure(
                        currentMatches[
                            highlightedIndex
                        ]
                    );

                    return;
                }


                submitGuess();
            }


            /*
             * Escape
             */

            if (
                event.key === 'Escape'
            ) {

                closePicker();

                input.blur();
            }
        }
    );


    /* =========================================
       CLICK OUTSIDE
    ========================================= */

    document.addEventListener(
        'pointerdown',
        function(event) {

            if (
                !event.target.closest(
                    '.input-wrapper'
                )
            ) {

                closePicker();
            }
        }
    );


    /* =========================================
       SUBMIT BUTTON
    ========================================= */

    submitBtn.addEventListener(
        'click',
        function() {

            submitGuess();
        }
    );


    /* =========================================
       SHARE
    ========================================= */

    function countGreenAttributes(
        guess,
        target
    ) {

        let greenCount = 0;


        if (
            guess.arena ===
            target.arena
        ) greenCount++;


        if (
            guess.netWorth ===
            target.netWorth
        ) greenCount++;


        if (
            guess.country ===
            target.country
        ) greenCount++;


        if (
            guess.followers ===
            target.followers
        ) greenCount++;


        if (
            guess.gender ===
            target.gender
        ) greenCount++;


        if (
            guess.age ===
            target.age
        ) greenCount++;


        return greenCount;
    }


    function buildShareEmojiGrid() {

        const emojiList = [];


        guessHistoryObjects.forEach(
            guess => {

                if (
                    guess.name ===
                    secretFigure.name
                ) {

                    emojiList.push(
                        "🟩"
                    );

                } else {

                    const greens =
                        countGreenAttributes(
                            guess,
                            secretFigure
                        );


                    if (greens >= 4) {

                        emojiList.push(
                            "🟨"
                        );

                    } else {

                        emojiList.push(
                            "⬛"
                        );
                    }
                }
            }
        );


        return emojiList.join('');
    }


    shareBtn.addEventListener(
        'click',
        function() {

            const resultStatus =
                guessedNames.has(
                    secretFigure.name
                )
                    ? `${guessedNames.size}/10`
                    : 'X/10';


            const emojiBlocks =
                buildShareEmojiGrid();


            const gameUrl =
                window.location.href;


            const scoreText =
                `Persondle #${dayIndex + 1}: ${resultStatus}
${emojiBlocks}

Play today's round - ${gameUrl}`;


            if (
                navigator.share
            ) {

                navigator.share({
                    text: scoreText
                });

            }

            else if (
                navigator.clipboard
            ) {

                navigator.clipboard
                    .writeText(
                        scoreText
                    )
                    .then(
                        () => {
                            alert(
                                "Score copied to clipboard!"
                            );
                        }
                    )
                    .catch(
                        () => {
                            alert(
                                scoreText
                            );
                        }
                    );

            }

            else {

                alert(
                    scoreText
                );
            }
        }
    );

</script>

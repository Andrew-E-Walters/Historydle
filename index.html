            color: #818384;
            margin-bottom: 8px;
        }

        .game-container {

            flex-direction: column;
            gap: 12px;
        }

            padding-bottom: 8px;

            flex: 1;

        }

            color: #555555;

            color: #000000;

            border: none;

            padding: 0 16px;

            font-size: 0.95rem;
            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            text-transform: uppercase;

        .submit-btn:active {

            background-color: #3a3a3c;
            color: #777777;
            cursor: not-allowed;
        }

            right: 0;

            background-color: #121213;

            border: 2px solid #3a3a3c;

            border-radius: 8px;

            max-height: 250px;

            overflow-x: hidden;

            z-index: 10000;

            display: none;

    /* IMPORTANT FOR MOBILE SCROLLING */
    touch-action: pan-y;
    overscroll-behavior: contain;
}

        .suggestion-item {

            border-bottom: 1px solid #3a3a3c;

            color: #ffffff;

            text-align: left;

            font-size: 0.95rem;

            background-color: #121213;

            user-select: none;

            -webkit-user-select: none;

            flex-direction: column;

        @keyframes fadeIn {

                transform: translateY(-6px);
            }

            to {

            }

            color: #ffffff;

            align-items: center;

            border-radius: 6px;

            min-height: 56px;

            background-color: var(--yellow);

        .cell.wrong {

            );

        /* =========================================================
           NUMBER PARSER
           ========================================================= */

        function parseNumericValue(value) {

            if (typeof value === "number") {
                return value;
            }

            if (!value) {
                return 0;
            }

            const str =
                String(value)
                    .trim()
                    .toUpperCase()
                    .replace(/\s+/g, "");


            let multiplier = 1;


            if (
                str.endsWith("B") ||
                str.endsWith("BN") ||
                str.endsWith("BILLION")
            ) {

                multiplier = 1000000000;

            }

            else if (
                str.endsWith("M") ||
                str.endsWith("MN") ||
                str.endsWith("MILLION")
            ) {

                multiplier = 1000000;

            }

            else if (
                str.endsWith("K") ||
                str.endsWith("THOUSAND")
            ) {

                multiplier = 1000;

            }


            const num =
                parseFloat(
                    str.replace(
                        /[^0-9.-]+/g,
                        ""
                    )
                );


            return isNaN(num)
                ? 0
                : num * multiplier;

        }


        /* =========================================================
           CREATE ATTRIBUTE CELL
           ========================================================= */

        function createCell(
            title,
            value,
            targetValue,
            icon,
            type = "standard",
            isReveal = false
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            const numValue =
                parseNumericValue(value);

            const numTarget =
                parseNumericValue(targetValue);


            let statusClass =
                "wrong";


            /* COUNTRY */

            if (type === "country") {

                if (value === targetValue) {

                    statusClass =
                        "correct";

                }

                else if (
                    countryContinents[value] &&
                    countryContinents[targetValue] &&
                    countryContinents[value] ===
                    countryContinents[targetValue]
                ) {

                    statusClass =
                        "partial";

                }

            }


            /* AGE */

            else if (type === "age") {

                if (numValue === numTarget) {

                    statusClass =
                        "correct";

                }

                else if (
                    Math.abs(
                        numValue -
                        numTarget
                    ) <= 10
                ) {

                    statusClass =
                        "partial";

                }

            }


            /* FOLLOWERS */

            else if (type === "followers") {

                if (numValue === numTarget) {

                    statusClass =
                        "correct";

                }

                else if (
                    Math.abs(
                        numValue -
                        numTarget
                    ) <=
                    (
                        numTarget * 0.3
                    ) ||
                    Math.abs(
                        numValue -
                        numTarget
                    ) <= 300000
                ) {

                    statusClass =
                        "partial";

                }

            }


            /* NET WORTH */

            else if (type === "netWorth") {

                const difference =
                    Math.abs(
                        numValue -
                        numTarget
                    );


                if (
                    difference === 0 ||
                    difference <=
                    numTarget * 0.15 ||
                    difference <= 15000000
                ) {

                    statusClass =
                        "correct";

                }

                else if (
                    difference <=
                    numTarget * 0.3 ||
                    difference <= 40000000
                ) {

                    statusClass =
                        "partial";

                }

            }


            /* STANDARD TEXT */

            else {

                if (
                    String(value)
                        .trim()
                        .toLowerCase()
                    ===
                    String(targetValue)
                        .trim()
                        .toLowerCase()
                ) {

                    statusClass =
                        "correct";

                }

            }


            cell.classList.add(
                statusClass
            );


            let displayValue =
                value;


            /* AGE ARROW */

            if (
                type === "age" &&
                numValue !== numTarget &&
                !isReveal
            ) {

                displayValue +=
                    numValue < numTarget
                        ? " ⬆️"
                        : " ⬇️";

            }


            /* NET WORTH FORMAT */

            else if (
                type === "netWorth"
            ) {

                const formatted =
                    new Intl.NumberFormat(
                        "en-US",
                        {
                            style: "currency",
                            currency: "USD",
                            notation: "compact",
                            maximumFractionDigits: 1
                        }
                    ).format(numValue);


                displayValue =
                    !isReveal &&
                    numValue !== numTarget
                        ? formatted +
                          (
                              numValue <
                              numTarget
                                  ? " ⬆️"
                                  : " ⬇️"
                          )
                        : formatted;

            }


            /* FOLLOWERS FORMAT */

            else if (
                type === "followers"
            ) {

                const formatted =
                    new Intl.NumberFormat(
                        "en-US",
                        {
                            notation: "compact",
                            maximumFractionDigits: 1
                        }
                    ).format(numValue);


                displayValue =
                    !isReveal &&
                    numValue !== numTarget
                        ? formatted +
                          (
                              numValue <
                              numTarget
                                  ? " ⬆️"
                                  : " ⬇️"
                          )
                        : formatted;

            }


            cell.innerHTML =
                `<span>${icon || ""} ${displayValue}</span>`;


            return cell;

        }

        /* =========================================================
           LOCAL STORAGE
           ========================================================= */

        function loadGame() {

            let savedData = {};

            try {

                savedData =
                    JSON.parse(
                        localStorage.getItem(
                            "persondle_state"
                        ) || "{}"
                    );

            }

            catch (error) {

                savedData = {};

            }


            if (
                savedData.date === todayStr &&
                Array.isArray(savedData.guesses)
            ) {

                savedData.guesses.forEach(
                    function(name) {

                        const figure =
                            figures.find(
                                function(person) {
                                    return (
                                        person.name ===
                                        name
                                    );
                                }
                            );


                        if (figure) {

                            guessedNames.add(
                                figure.name
                            );

                            guessHistoryObjects.push(
                                figure
                            );

                            renderGuessCard(
                                figure
                            );

                        }

                    }
                );


                updateGuessCounter();


                if (
                    guessedNames.has(
                        secretFigure.name
                    )
                ) {

                    triggerGameOver(
                        true,
                        guessedNames.size
                    );

                }

                else if (
                    guessedNames.size >=
                    maxGuesses
                ) {

                    triggerGameOver(
                        false,
                        guessedNames.size
                    );

                }

            }

            else {

                saveState();

            }

        }

                        date: todayStr,
                        guesses:
                            Array.from(

                            )
                    }
                )
            );

        }

        function showSuggestions() {

            if (gameOver) {
                return;
            }


            const query =
                input.value
                    .trim()
                    .toLowerCase();


            suggestionsBox.innerHTML = "";


            if (!query) {

                suggestionsBox.style.display =
                    "none";

                return;

            }


            /*
             * Search directly through the figures database.
             */

            const matches =
                figures.filter(
                    function(figure) {

                        return (
                            figure.name
                                .toLowerCase()
                                .includes(query)
                            &&
                            !guessedNames.has(
                                figure.name
                            )
                        );

                    }
                );


            if (matches.length === 0) {

                suggestionsBox.style.display =
                    "none";

                return;

            }


            /*
             * Show up to 12 matching figures.
             */

            const visibleMatches =
                matches.slice(0, 12);


            visibleMatches.forEach(
                function(figure) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "suggestion-item";


                    item.textContent =
                        figure.name;


                    /*
                     * IMPORTANT:
                     *
                     * pointerdown lets the user select
                     * a name on desktop and mobile.
                     *
                     * We are NOT using click here.
                     *
                     * This prevents the normal click event
                     * from interfering with mobile scrolling.
                     */

                    item.addEventListener(
                        "pointerdown",
                        function(event) {

                            /*
                             * Only select the figure when
                             * the user actually touches/clicks
                             * the suggestion.
                             */

                            event.stopPropagation();

                            selectFigure(
                                figure

                        }
                    );


                    suggestionsBox.appendChild(
                        item
                    );

                }
            );


            suggestionsBox.style.display =
                "block";

        }

                return;

            input.value =

        let selectedSuggestion =
            -1;


        input.addEventListener(
            "keydown",
            function(event) {

                const items =
                    suggestionsBox.querySelectorAll(

                if (

                ) {

                    if (
                        suggestionsBox.style.display ===

                        items.length > 0
                    ) {

                        event.preventDefault();


                        selectedSuggestion =
                            Math.min(
                                selectedSuggestion + 1,
                                items.length - 1
                            );


                        items.forEach(
                            function(item, index) {

                                item.style.backgroundColor =
                                    index ===
                                    selectedSuggestion
                                        ? "#3a3a3c"
                                        : "#121213";

                            }
                        );


                        /*
                         * Keep the selected item visible
                         * when moving with the keyboard.
                         */

                        if (
                            items[
                                selectedSuggestion
                            ]
                        ) {

                            items[
                                selectedSuggestion
                            ].scrollIntoView(
                                {
                                    block: "nearest"
                                }
                            );

                        }

                    }

                    return;

                }


                if (
                    event.key === "ArrowUp"
                ) {

                    if (
                        suggestionsBox.style.display ===
                        "block" &&
                        items.length > 0
                    ) {

                        event.preventDefault();


                        selectedSuggestion =
                            Math.max(
                                selectedSuggestion - 1,
                                0
                            );


                        items.forEach(
                            function(item, index) {

                                item.style.backgroundColor =
                                    index ===
                                    selectedSuggestion

                                        : "#121213";

                            }
                        );


                        if (

                                }
                            );

                        }

                    }

                    return;

                }


                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();


                    if (
                        suggestionsBox.style.display ===
                        "block" &&
                        items.length > 0
                    ) {

                        /*
                         * If the user has highlighted

                                    bubbles: true
                                }
                            )

                        selectedSuggestion =

                    submitGuess();

        /* =========================================================
           SUBMIT GUESS
           ========================================================= */

        function submitGuess() {

            if (gameOver) {
                return;
            }


            const guessName =
                input.value.trim();


            if (!guessName) {

                alert(
                    "Please type a figure's name."
                );

                input.focus();

                return;

            }


            const figure =
                figures.find(
                    function(person) {

                        return (
                            person.name
                                .toLowerCase()
                            ===
                            guessName
                                .toLowerCase()
                        );

                    }
                );


            if (!figure) {

                alert(
                    "Please select a valid figure from the search suggestions."
                );

                input.focus();

                return;

            }


            if (
                guessedNames.has(
                    figure.name
                )
            ) {

                alert(
                    "You've already guessed this figure!"
                );

                return;

            }


            guessedNames.add(
                figure.name
            );


            guessHistoryObjects.push(
                figure
            );


            saveState();


            input.value =
                "";


            suggestionsBox.innerHTML =
                "";


            suggestionsBox.style.display =
                "none";


            selectedSuggestion =
                -1;


            updateGuessCounter();


            renderGuessCard(
                figure
            );


            const attempts =
                guessedNames.size;


            if (
                figure.name ===
                secretFigure.name
            ) {

                triggerGameOver(
                    true,
                    attempts
                );


                endGameBox.scrollIntoView(
                    {
                        behavior: "smooth",
                        block: "center"
                    }
                );

            }

            else if (
                attempts >=
                maxGuesses
            ) {

                triggerGameOver(
                    false,
                    attempts
                );


                endGameBox.scrollIntoView(
                    {
                        behavior: "smooth",
                        block: "center"
                    }
                );

            }

        }


        submitBtn.addEventListener(
            "click",
            submitGuess
        );

        function getEndGameMessage(
            attempts,
            won

            if (!won) {

                const messages = [

                    "Oof, 0 for 10. Don't worry, reading the news is always an option for tomorrow!",

                    "Tough luck! 10 guesses and still missed. Maybe pop culture just isn't your calling.",

                    "Well, at least you were consistent... consistently wrong! Better luck tomorrow.",

                    "Out of guesses! Go take a quick walk, clear your head, and try again tomorrow.",

                    "10 attempts, zero hits! The secret figure remains in the shadows until tomorrow.",

                    "A swing and a complete miss across all 10 tries! Time to do some light research."

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            if (attempts === 1) {

                const messages = [

                    "Hole in 1! Either you built this game, or you have telepathic powers.",

                    "On the VERY FIRST TRY?! Okay, genius, save some brain cells for the rest of us.",

                    "1/10! Pure psychic wizardry. You should play the lottery today."

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            if (attempts === 2) {

                const messages = [

                    "Guessed in 2 tries! Absolutely clinical precision.",

                    "In just 2 attempts? That's practically a flex. Outstanding job!",

                    "2 guesses! Narrowed it down and closed the deal in seconds."

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            if (
                attempts >= 3 &&
                attempts <= 4
            ) {

                const messages = [

                    `Got it in ${attempts}! Sharp deduction skills on display today.`,

                    `Winner in ${attempts} tries! Very clean gameplay, no panicking necessary.`,

                    `Only ${attempts} guesses needed! Smooth, logical, and quick.`

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            if (
                attempts >= 5 &&
                attempts <= 6
            ) {

                const messages = [

                    `Nail-biter territory! Solved in ${attempts} attempts. Nice recovery!`,

                    `Got there in ${attempts}! Took a few adjustments, but a win is a win.`,

                    `In ${attempts} guesses! Balanced deduction with a hint of dramatic suspense.`

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            if (
                attempts >= 7 &&
                attempts <= 8
            ) {

                const messages = [

                    `Whew! Solved on try #${attempts}. You were cutting it a bit close there!`,

                    `In ${attempts} attempts! A victory pulled right out of the fire.`,

                    `Took ${attempts} tries! The path was winding, but you reached the finish line.`

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }


            const messages = [

                `Congrats! You eventually stumbled across the correct answer on try #${attempts}. We were starting to lose hope.`,

                `You got it in ${attempts}! Only took almost every single try you had available.`,

                `Winner in ${attempts} guesses! Though let's be honest, that was more of a brute-force victory than skill.`,

                `On attempt #${attempts}! Defeated at the very edge of the cliff!`

            ];


            return messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )

        /* =========================================================
           GAME OVER
           ========================================================= */

        function triggerGameOver(
            won,
            attempts
        ) {

            gameOver = true;


            endGameText.textContent =
                getEndGameMessage(
                    attempts,
                    won
                );


            endGameBox.className =
                `end-game-message ${
                    won
                        ? "win"
                        : "loss"
                }`;


            endGameBox.style.display =
                "block";


            input.disabled =
                true;


            submitBtn.disabled =
                true;


            suggestionsBox.style.display =
                "none";


            /*
             * Reveal secret figure after a loss.
             */

            if (!won) {

                const alreadyRevealed =
                    Array.from(
                        guessesContainer
                            .children
                    ).some(
                        function(card) {

                            return card
                                .textContent
                                .includes(
                                    "SECRET FIGURE:"
                                );

                        }
                    );


                if (!alreadyRevealed) {

                    renderGuessCard(
                        secretFigure,
                        true
                    );

                }

            }

        }


        /* =========================================================
           COUNTDOWN
           ========================================================= */

        function updateCountdown() {

            const current =
                new Date();


            const tomorrow =
                new Date(
                    current.getFullYear(),
                    current.getMonth(),
                    current.getDate() + 1
                );


            const difference =
                tomorrow - current;


            const hours =
                String(
                    Math.floor(
                        (
                            difference /
                            (1000 * 60 * 60)
                        ) % 24
                    )
                ).padStart(2, "0");


            const minutes =
                String(
                    Math.floor(
                        (
                            difference /
                            (1000 * 60)
                        ) % 60
                    )
                ).padStart(2, "0");


            const seconds =
                String(
                    Math.floor(
                        (
                            difference /
                            1000
                        ) % 60
                    )
                ).padStart(2, "0");


            document.getElementById(
                "countdown"
            ).textContent =
                `${hours}:${minutes}:${seconds}`;

        }


        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );

           SHARE RESULT
           ========================================================= */

        function countGreenAttributes(
            guess,
            target
        ) {

            let greenCount = 0;


            if (
                guess.arena ===
                target.arena
            ) {
                greenCount++;
            }


            if (
                guess.netWorth ===
                target.netWorth
            ) {
                greenCount++;
            }


            if (
                guess.country ===
                target.country
            ) {
                greenCount++;
            }


            if (
                guess.followers ===
                target.followers
            ) {
                greenCount++;
            }


            if (
                guess.gender ===
                target.gender
            ) {
                greenCount++;
            }


            if (
                guess.age ===
                target.age
            ) {
                greenCount++;
            }


            return greenCount;

        }


        function buildShareEmojiGrid() {

            const emojiList = [];


            guessHistoryObjects.forEach(
                function(guess) {

                    if (
                        guess.name ===
                        secretFigure.name
                    ) {

                        emojiList.push(
                            "🟩"
                        );

                    }

                    else {

                        const greens =
                            countGreenAttributes(
                                guess,
                                secretFigure
                            );


                        if (
                            greens >= 4
                        ) {

                            emojiList.push(
                                "🟨"
                            );

                        }

                        else {

                            emojiList.push(
                                "⬛"
                            );

                        }

                    }

                }
            );


            return emojiList.join("");

        }

                ) {

                    try {

                        await navigator.share(
                            {
                                text:
                                    scoreText
                            }
                        );

                    }

                    catch (error) {

                        /*
                         * User cancelled sharing.
                         * Nothing needs to happen.
                         */

                    }

                    return;

                }


                /*
                 * Clipboard fallback.
                 */

                if (
                    navigator.clipboard
                ) {

                    try {

                        await navigator.clipboard.writeText(
                            scoreText
                        );


                        alert(
                            "Score copied to clipboard!"
                        );


                        return;

                    }

                    catch (error) {

                        /* Continue to text fallback */

                    }

                }


                alert(
                    scoreText
                );

            }
        );


        /* =========================================================
           START GAME
           ========================================================= */

        loadGame();

    </script>

</body>
</html>

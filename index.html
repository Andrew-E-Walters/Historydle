<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Persondle - Daily 21st Century Figures</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #242526;
            --bg-color: #000000;
            --card-bg: #121213;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
            --red: #8b0000;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            margin: 4px 0 2px 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #ffffff; 
            font-size: 1.5rem;
            text-align: center;
        }

        .subtitle { 
            color: #a0a0a2; 
            margin-bottom: 8px; 
            font-size: 0.82rem; 
            text-align: center; 
            line-height: 1.35;
            padding: 0 4px;
        }

        .daily-tracker {
            color: #6aaa64;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guess-counter {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #818384;
            margin-bottom: 8px;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box-row {
            display: flex;
            gap: 8px;
            width: 100%;
            position: sticky;
            top: 8px;
            z-index: 1000;
            background-color: var(--bg-color);
            padding-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #818384;
        }

        input:disabled {
            background-color: #1a1a1c;
            color: #555555;
            cursor: not-allowed;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            min-height: 44px;
        }

        .submit-btn:active { 
            background-color: #cccccc; 
        }

        .submit-btn:disabled {
            background-color: #3a3a3c;
            color: #777777;
            cursor: not-allowed;
        }

        .suggestions {
            position: absolute;
            top: 100%; 
            left: 0; 
            right: 0;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }

        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            text-align: left;
            font-size: 0.95rem;
        }

        .suggestion-item:active { 
            background-color: #2a2a2b; 
        }

        .guess-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guess-card-header {
            font-size: 1.05rem;
            font-weight: bold;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .cell {
            background-color: #1a1a1c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-align: center;
        }

        .cell.correct { 
            background-color: var(--green); 
            border-color: var(--green); 
        }
        
        .cell.partial { 
            background-color: var(--yellow); 
            border-color: var(--yellow); 
            color: #000000; 
        }

        .cell.partial .text-label, 
        .cell.partial .attr-title { 
            color: #000000; 
        }

        .cell.wrong { 
            background-color: #1a1a1c; 
            border-color: var(--border-color); 
        }

        .cell .attr-title {
            font-size: 0.62rem;
            text-transform: uppercase;
            color: #818384;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .cell .emoji-icon { 
            font-size: 1.05rem; 
            line-height: 1;
            margin-bottom: 2px;
        }

        .cell .text-label { 
            font-size: 0.72rem;
            font-weight: 600;
            width: 100%; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }

        .end-game-message {
            text-align: center;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            border: 2px solid var(--green);
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            line-height: 1.4;
        }

        .end-game-message.loss {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .end-game-message.win {
            border-color: var(--green);
            color: #ffffff;
        }

        .next-person-timer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #a0a0a2;
            font-weight: normal;
        }

        .share-btn {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            text-transform: uppercase;
            width: 100%;
        }

        .share-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1>PERSONDLE</h1>
    <div class="subtitle">
        Guess the 21st century figure. They can be from any of these arenas: <br>
        <strong>Music, Movies, TV, Politics, Sports, Business, Tech & Science, Influencers, Podcasters</strong>
    </div>

    <div id="daily-number" class="daily-tracker">PERSONDLE #1</div>

    <div class="game-container">
        <div id="guess-counter" class="guess-counter">Guesses: 0 / 10</div>

        <div class="search-box-row">
            <div class="input-wrapper">
                <input type="text" id="guess-input" placeholder="Type a figure's name..." autocomplete="off" autocorrect="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
            <button id="submit-guess-btn" class="submit-btn">Guess</button>
        </div>

        <div id="end-game-box" class="end-game-message">
            <div id="end-game-text"></div>
            <div id="timer-display" class="next-person-timer">Next Person in: <span id="countdown">00:00:00</span></div>
            <button id="share-button" class="share-btn">Share Result 📋</button>
        </div>

        <div id="guesses-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <script>
        const maxGuesses = 10;

        const arenaEmojis = {
            "Music": "🎵",
            "Movies": "🎬",
            "TV": "📺",
            "Politics": "🏛️",
            "Sports": "🏆",
            "Business": "💼",
            "Tech & Science": "🔬",
            "Influencers": "📱",
            "Podcasters": "🎙️"
        };

        const countryEmojis = {
            "USA": "🇺🇸", 
            "South Africa": "🇿🇦", 
            "UK": "🇬🇧", 
            "Germany": "🇩🇪", 
            "India": "🇮🇳", 
            "Australia": "🇦🇺", 
            "Canada": "🇨🇦", 
            "Ukraine": "🇺🇦",
            "Sweden": "🇸🇪",
            "Argentina": "🇦🇷",
            "Portugal": "🇵🇹",
            "France": "🇫🇷",
            "Brazil": "🇧🇷",
            "Norway": "🇳🇴",
            "Japan": "🇯🇵",
            "Italy": "🇮🇹"
        };

        const countryContinents = {
            "USA": "North America",
            "Canada": "North America",
            "UK": "Europe",
            "Germany": "Europe",
            "Ukraine": "Europe",
            "Sweden": "Europe",
            "Portugal": "Europe",
            "France": "Europe",
            "Norway": "Europe",
            "Italy": "Europe",
            "India": "Asia",
            "Japan": "Asia",
            "South Africa": "Africa",
            "Australia": "Oceania",
            "Argentina": "South America",
            "Brazil": "South America"
        };

        const genderEmojis = {
            "Male": "👨",
            "Female": "👩"
        };

        function getAgeGroupEmoji(age) {
            if (age < 40) return "🧑";
            if (age < 65) return "👨";
            if (age < 80) return "👴";
            return "🧙‍♂️";
        }

        // Master Database (Across 9 Arenas)
        const figures = [
            // Music
            { name: "Taylor Swift", arena: "Music", field: "Pop Star", country: "USA", state: "PA", gender: "Female", age: 36 },
            { name: "Beyoncé", arena: "Music", field: "R&B Star", country: "USA", state: "TX", gender: "Female", age: 45 },
            { name: "Drake", arena: "Music", field: "Hip-Hop", country: "Canada", state: "Ontario", gender: "Male", age: 39 },
            { name: "Eminem", arena: "Music", field: "Hip-Hop", country: "USA", state: "MO", gender: "Male", age: 53 },
            { name: "Lady Gaga", arena: "Music", field: "Pop Star", country: "USA", state: "NY", gender: "Female", age: 40 },

            // Movies
            { name: "Leonardo DiCaprio", arena: "Movies", field: "Acting", country: "USA", state: "CA", gender: "Male", age: 51 },
            { name: "Margot Robbie", arena: "Movies", field: "Acting", country: "Australia", state: "Queensland", gender: "Female", age: 36 },
            { name: "Tom Cruise", arena: "Movies", field: "Acting", country: "USA", state: "NY", gender: "Male", age: 64 },
            { name: "Zendaya", arena: "Movies", field: "Acting", country: "USA", state: "CA", gender: "Female", age: 30 },
            { name: "Dwayne Johnson", arena: "Movies", field: "Acting", country: "USA", state: "CA", gender: "Male", age: 54 },

            // TV
            { name: "Oprah Winfrey", arena: "TV", field: "Talk Show", country: "USA", state: "MS", gender: "Female", age: 72 },
            { name: "Jon Stewart", arena: "TV", field: "Late Night", country: "USA", state: "NY", gender: "Male", age: 63 },
            { name: "Steve Carell", arena: "TV", field: "Comedy", country: "USA", state: "MA", gender: "Male", age: 64 },
            { name: "Gordon Ramsay", arena: "TV", field: "Reality Host", country: "UK", state: "Renfrewshire", gender: "Male", age: 59 },
            { name: "Kim Kardashian", arena: "TV", field: "Reality TV", country: "USA", state: "CA", gender: "Female", age: 45 },

            // Politics
            { name: "Barack Obama", arena: "Politics", field: "President", country: "USA", state: "HI", gender: "Male", age: 65 },
            { name: "Donald Trump", arena: "Politics", field: "President", country: "USA", state: "NY", gender: "Male", age: 80 },
            { name: "Joe Biden", arena: "Politics", field: "President", country: "USA", state: "PA", gender: "Male", age: 83 },
            { name: "Kamala Harris", arena: "Politics", field: "Vice Pres", country: "USA", state: "CA", gender: "Female", age: 61 },
            { name: "Volodymyr Zelenskyy", arena: "Politics", field: "President", country: "Ukraine", state: "Kryvyi Rih", gender: "Male", age: 48 },

            // Sports
            { name: "LeBron James", arena: "Sports", field: "Basketball", country: "USA", state: "OH", gender: "Male", age: 41 },
            { name: "Serena Williams", arena: "Sports", field: "Tennis", country: "USA", state: "MI", gender: "Female", age: 45 },
            { name: "Tom Brady", arena: "Sports", field: "Football", country: "USA", state: "CA", gender: "Male", age: 49 },
            { name: "Lionel Messi", arena: "Sports", field: "Soccer", country: "Argentina", state: "Santa Fe", gender: "Male", age: 39 },
            { name: "Shohei Ohtani", arena: "Sports", field: "Baseball", country: "Japan", state: "Iwate", gender: "Male", age: 32 },

            // Business
            { name: "Warren Buffett", arena: "Business", field: "Investing", country: "USA", state: "NE", gender: "Male", age: 96 },
            { name: "Mark Cuban", arena: "Business", field: "Shark Tank", country: "USA", state: "PA", gender: "Male", age: 68 },
            { name: "Jeff Bezos", arena: "Business", field: "E-Commerce", country: "USA", state: "NM", gender: "Male", age: 62 },
            { name: "Jamie Dimon", arena: "Business", field: "Banking", country: "USA", state: "NY", gender: "Male", age: 70 },
            { name: "Martha Stewart", arena: "Business", field: "Media Mogul", country: "USA", state: "NJ", gender: "Female", age: 85 },

            // Tech & Science
            { name: "Elon Musk", arena: "Tech & Science", field: "Tech CEO", country: "South Africa", state: "Gauteng", gender: "Male", age: 55 },
            { name: "Bill Gates", arena: "Tech & Science", field: "Tech Founder", country: "USA", state: "WA", gender: "Male", age: 70 },
            { name: "Mark Zuckerberg", arena: "Tech & Science", field: "Social Media", country: "USA", state: "NY", gender: "Male", age: 42 },
            { name: "Neil deGrasse Tyson", arena: "Tech & Science", field: "Astrophysics", country: "USA", state: "NY", gender: "Male", age: 67 },
            { name: "Anthony Fauci", arena: "Tech & Science", field: "Medicine", country: "USA", state: "NY", gender: "Male", age: 85 },

            // Influencers
            { name: "MrBeast", arena: "Influencers", field: "YouTube", country: "USA", state: "NC", gender: "Male", age: 28 },
            { name: "Charli D'Amelio", arena: "Influencers", field: "TikTok", country: "USA", state: "CT", gender: "Female", age: 22 },
            { name: "Logan Paul", arena: "Influencers", field: "YouTube/WWE", country: "USA", state: "OH", gender: "Male", age: 31 },
            { name: "Khaby Lame", arena: "Influencers", field: "TikTok", country: "Italy", state: "Senegal", gender: "Male", age: 26 },
            { name: "Kai Cenat", arena: "Influencers", field: "Twitch", country: "USA", state: "NY", gender: "Male", age: 24 },

            // Podcasters
            { name: "Joe Rogan (The Joe Rogan Experience)", arena: "Podcasters", field: "Interview", country: "USA", state: "NJ", gender: "Male", age: 59 },
            { name: "Alex Cooper (Call Her Daddy)", arena: "Podcasters", field: "Culture", country: "USA", state: "PA", gender: "Female", age: 32 },
            { name: "Theo Von (This Past Weekend)", arena: "Podcasters", field: "Comedy", country: "USA", state: "LA", gender: "Male", age: 46 },
            { name: "Travis Kelce (New Heights)", arena: "Podcasters", field: "Sports", country: "USA", state: "OH", gender: "Male", age: 37 },
            { name: "Dax Shepard (Armchair Expert)", arena: "Podcasters", field: "Interview", country: "USA", state: "MI", gender: "Male", age: 51 }
        ];

        // --- DAILY SELECTION LOGIC ---
        // Epoch anchor: Jan 1, 2026 UTC
        const epochDate = new Date('2026-01-01T00:00:00Z');
        const now = new Date();

        // Unique day identifier string (YYYY-MM-DD) in local time
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        
        // Days since epoch for index calculation
        const daysSinceEpoch = Math.floor((now - epochDate) / (1000 * 60 * 60 * 24));
        const dayIndex = Math.max(0, daysSinceEpoch);
        
        // Deterministic pick based on dayIndex
        const secretFigure = figures[dayIndex % figures.length];

        // Set Persondle # number in heading
        document.getElementById('daily-number').textContent = `PERSONDLE #${dayIndex + 1}`;

        const input = document.getElementById('guess-input');
        const suggestionsBox = document.getElementById('suggestions');
        const submitBtn = document.getElementById('submit-guess-btn');
        const guessesContainer = document.getElementById('guesses-container');
        const endGameBox = document.getElementById('end-game-box');
        const endGameText = document.getElementById('end-game-text');
        const shareBtn = document.getElementById('share-button');
        const guessCounterDisplay = document.getElementById('guess-counter');

        const guessedNames = new Set();
        let gameOver = false;

        // --- LOCAL STORAGE PERSISTENCE ---
        const savedData = JSON.parse(localStorage.getItem('persondle_state') || '{}');

        // Restore guesses if stored for today
        if (savedData.date === todayStr && Array.isArray(savedData.guesses)) {
            savedData.guesses.forEach(name => {
                const figureObj = figures.find(f => f.name === name);
                if (figureObj) {
                    guessedNames.add(figureObj.name);
                    renderGuessCard(figureObj);
                }
            });

            guessCounterDisplay.textContent = `Guesses: ${guessedNames.size} / ${maxGuesses}`;

            // Check if game was already won or lost
            if (guessedNames.has(secretFigure.name)) {
                triggerGameOver(true, guessedNames.size);
            } else if (guessedNames.size >= maxGuesses) {
                triggerGameOver(false, guessedNames.size);
            }
        } else {
            // New day: clear old local storage
            localStorage.setItem('persondle_state', JSON.stringify({ date: todayStr, guesses: [] }));
        }

        function saveState() {
            localStorage.setItem('persondle_state', JSON.stringify({
                date: todayStr,
                guesses: Array.from(guessedNames)
            }));
        }

        // --- COUNTDOWN TIMER UNTIL MIDNIGHT ---
        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diffMs = tomorrow - now;

            const hours = String(Math.floor((diffMs / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const minutes = String(Math.floor((diffMs / (1000 * 60)) % 60)).padStart(2, '0');
            const seconds = String(Math.floor((diffMs / 1000) % 60)).padStart(2, '0');

            document.getElementById('countdown').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Autocomplete suggestions
        input.addEventListener('input', () => {
            if (gameOver) return;

            const query = input.value.trim().toLowerCase();
            suggestionsBox.innerHTML = '';

            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = figures.filter(f => 
                f.name.toLowerCase().includes(query) && !guessedNames.has(f.name)
            );

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.name;
                
                div.addEventListener('click', () => {
                    input.value = item.name;
                    suggestionsBox.style.display = 'none';
                });

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-wrapper')) {
                suggestionsBox.style.display = 'none';
            }
        });

        function renderGuessCard(guess, isReveal = false) {
            const card = document.createElement('div');
            card.className = 'guess-card';

            const cardHeader = document.createElement('div');
            cardHeader.className = 'guess-card-header';
            cardHeader.innerHTML = `<span>${isReveal ? 'SECRET FIGURE: ' : ''}${guess.name}</span>`;
            card.appendChild(cardHeader);

            const grid = document.createElement('div');
            grid.className = 'attributes-grid';

            function createCell(title, value, targetValue, icon, type = 'standard') {
                const cell = document.createElement('div');
                cell.className = 'cell';

                let statusClass = 'wrong';

                if (type === 'country') {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    } else if (countryContinents[value] === countryContinents[targetValue]) {
                        statusClass = 'partial';
                    }
                } else if (type === 'age') {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    } else if (Math.abs(value - targetValue) <= 10) {
                        statusClass = 'partial';
                    }
                } else {
                    if (value === targetValue) {
                        statusClass = 'correct';
                    }
                }

                cell.classList.add(statusClass);

                let displayVal = value;
                if (type === 'age' && value !== targetValue && !isReveal) {
                    displayVal += value < targetValue ? ' ⬆' : ' ⬇️';
                }

                cell.innerHTML = `
                    <div class="attr-title">${title}</div>
                    ${icon ? `<span class="emoji-icon">${icon}</span>` : ''}
                    <div class="text-label">${displayVal}</div>
                `;

                return cell;
            }

            grid.appendChild(createCell('Arena', guess.arena, secretFigure.arena, arenaEmojis[guess.arena] || '🌟'));
            grid.appendChild(createCell('Field', guess.field, secretFigure.field, "🎯"));
            grid.appendChild(createCell('Country', guess.country, secretFigure.country, countryEmojis[guess.country] || '🌐', 'country'));
            grid.appendChild(createCell('Birth Place', guess.state, secretFigure.state, "📍"));
            grid.appendChild(createCell('Gender', guess.gender, secretFigure.gender, genderEmojis[guess.gender]));
            grid.appendChild(createCell('Age', guess.age, secretFigure.age, getAgeGroupEmoji(guess.age), 'age'));

            card.appendChild(grid);
            guessesContainer.insertBefore(card, guessesContainer.firstChild);
        }

        function getEndGameMessage(attempts, won) {
            if (!won) {
                const lossMessages = [
                    "Oof, 0 for 10. Don't worry, reading the news is always an option for tomorrow!",
                    "Tough luck! 10 guesses and still missed. Maybe pop culture just isn't your calling.",
                    "Well, at least you were consistent... consistently wrong! Better luck tomorrow.",
                    "Out of guesses! Go take a quick walk, clear your head, and try again tomorrow."
                ];
                return lossMessages[Math.floor(Math.random() * lossMessages.length)];
            }

            if (attempts === 1) {
                return "You guessed it in 1 attempt... Admit it, you either made this game or you're cheating.";
            } else if (attempts === 2) {
                return "In 2 guesses?! Okay, genius, save some brain cells for the rest of us.";
            } else if (attempts >= 3 && attempts <= 5) {
                return `Took you ${attempts} tries. Solid work, but let's not pretend you're a mastermind just yet.`;
            } else {
                const lateWinMessages = [
                    `Congrats! You eventually stumbled across the correct answer on try #${attempts}. We were starting to lose hope.`,
                    `You got it in ${attempts}! Only took almost every single try you had available.`,
                    `Winner in ${attempts} guesses! Though let's be honest, that was more of a brute-force victory than skill.`
                ];
                return lateWinMessages[Math.floor(Math.random() * lateWinMessages.length)];
            }
        }

        function triggerGameOver(won, attempts) {
            gameOver = true;
            endGameText.textContent = getEndGameMessage(attempts, won);
            endGameBox.className = `end-game-message ${won ? 'win' : 'loss'}`;
            endGameBox.style.display = 'block';
            input.disabled = true;
            submitBtn.disabled = true;

            if (!won && !document.querySelector('.guess-card-header span')?.textContent.includes('SECRET FIGURE')) {
                renderGuessCard(secretFigure, true);
            }
        }

        function submitGuess() {
            if (gameOver) return;

            const guessName = input.value.trim();
            const figure = figures.find(f => f.name.toLowerCase() === guessName.toLowerCase());

            if (!figure) {
                alert("Please select a valid figure from the dropdown list.");
                return;
            }

            if (guessedNames.has(figure.name)) {
                alert("You've already guessed this figure!");
                return;
            }

            guessedNames.add(figure.name);
            saveState();

            input.value = '';
            suggestionsBox.style.display = 'none';

            const currentAttemptCount = guessedNames.size;
            guessCounterDisplay.textContent = `Guesses: ${currentAttemptCount} / ${maxGuesses}`;

            renderGuessCard(figure);

            if (figure.name === secretFigure.name) {
                triggerGameOver(true, currentAttemptCount);
                endGameBox.scrollIntoView({ behavior: 'smooth' });
            } else if (currentAttemptCount >= maxGuesses) {
                triggerGameOver(false, currentAttemptCount);
                endGameBox.scrollIntoView({ behavior: 'smooth' });
            }
        }

        submitBtn.addEventListener('click', submitGuess);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitGuess();
            }
        });

        shareBtn.addEventListener('click', () => {
            const resultStatus = guessedNames.has(secretFigure.name) ? `${guessedNames.size}/10` : 'X/10';
            const scoreText = `Persondle #${dayIndex + 1}: ${resultStatus}\n${endGameText.textContent}`;
            if (navigator.share) {
                navigator.share({ text: scoreText });
            } else {
                navigator.clipboard.writeText(scoreText).then(() => {
                    alert("Score copied to clipboard!");
                }).catch(() => {
                    alert(scoreText);
                });
            }
        });
    </script>
</body>
</html>
